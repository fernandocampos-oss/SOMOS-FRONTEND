version: '3.8'

services:
  somos-frontend:
    image: node:16-alpine
    working_dir: /app
    volumes:
      - .:/app
      - somos_node_modules:/app/node_modules
    ports:
      - "4200:4200"
    command: sh -c "npm install --legacy-peer-deps && npm start -- --host 0.0.0.0 --disable-host-check"
    environment:
      - NODE_OPTIONS=--max_old_space_size=4096

volumes:
  somos_node_modules:
