<form [formGroup]="form" (ngSubmit)="onSave()">
  <h1 matDialogTitle>Sede</h1>
  <mat-dialog-content>
    <mat-form-field appearance="outline">
      <mat-label>Código Terminal (SAP)</mat-label>
      <input matInput required formControlName="terminalSap" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Nombre</mat-label>
      <input matInput required formControlName="descripcion" />
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions>
    <button mat-button mat-dialog-close type="button">Cancelar</button>
    <button mat-raised-button class="btnsave" type="submit">Grabar</button>
  </mat-dialog-actions>
</form>
