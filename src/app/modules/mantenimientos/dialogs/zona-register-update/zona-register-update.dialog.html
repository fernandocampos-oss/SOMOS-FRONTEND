<form [formGroup]="form" (ngSubmit)="onSave()">
  <h1 matDialogTitle>Zona</h1>
  <mat-dialog-content>
    <mat-form-field appearance="outline">
      <mat-label>Nombre</mat-label>
      <input matInput required formControlName="descripcion" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Dirección</mat-label>
      <input matInput formControlName="direccion" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Latitud</mat-label>
      <input matInput type="number" formControlName="latitud" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Longitud</mat-label>
      <input matInput type="number" formControlName="longitud" />
    </mat-form-field>

    <mat-form-field *appRole="roleAdminCentral" appearance="outline">
      <mat-label>Sede</mat-label>
      <mat-select formControlName="idSede" required>
        <mat-option *ngFor="let item of sedes" [value]="item.idSede">
          {{ item.descripcion }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Departamento</mat-label>
      <mat-select [formControl]="departmentCtrl">
        <mat-option *ngFor="let item of departments" [value]="item.codigo">
          {{ item.descripcion }}
        </mat-option>
      </mat-select>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Provincia</mat-label>
      <mat-select [formControl]="provinceCtrl">
        <mat-option *ngFor="let item of provinces" [value]="item.codigo">
          {{ item.descripcion }}
        </mat-option>
      </mat-select>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Distrito</mat-label>
      <mat-select formControlName="idUbigeo">
        <mat-option value=""></mat-option>
        <mat-option *ngFor="let item of districts" [value]="item.codigo">
          {{ item.descripcion }}
        </mat-option>
      </mat-select>
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions>
    <button mat-button mat-dialog-close type="button">Cancelar</button>
    <button mat-raised-button class="btnsave" type="submit">Grabar</button>
  </mat-dialog-actions>
</form>
