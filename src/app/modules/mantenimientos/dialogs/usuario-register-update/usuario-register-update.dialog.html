<form [formGroup]="form" (ngSubmit)="onSave()">
  <h2 matDialogTitle>Usuario</h2>
  <mat-dialog-content>
    <mat-form-field appearance="outline">
      <mat-label>Nro. Documento</mat-label>
      <input matInput required formControlName="numeroDocumento" />
      
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Cód. Planilla</mat-label>
      <input matInput required formControlName="codigoPlanilla" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Nombres</mat-label>
      <input matInput required formControlName="nombres" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Apellidos</mat-label>
      <input matInput required formControlName="apellidos" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Fecha Nacimiento</mat-label>

      <input
        matInput
        required
        formControlName="fechaNacimiento"
        [max]="maxFechaNacimiento"
        [matDatepicker]="fechaNacimientoPicker"
      />
      <mat-datepicker-toggle
        matSuffix
        [for]="fechaNacimientoPicker"
      ></mat-datepicker-toggle>
      <mat-datepicker
        #fechaNacimientoPicker
        startView="multi-year"
        [startAt]="startDate"
      ></mat-datepicker>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Celular</mat-label>
      <input matInput required formControlName="numeroCelular" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Correo</mat-label>
      <input matInput required formControlName="correo" />
    </mat-form-field>

    <mat-form-field *appRole="roleAdminCentral" appearance="outline" required>
      <mat-label>Sede</mat-label>
      <mat-select formControlName="idSede">
        <mat-option *ngFor="let item of sedes" [value]="item.codigo">
          {{ item.descripcion }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Zona</mat-label>
      <mat-select
        formControlName="idZonaControl"
        [required]="isRoleControlAccesoSelected"
      >
        <mat-option *ngFor="let item of zonas" [value]="item.idZona">
          {{ item.descripcion }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Rol</mat-label>
      <mat-select required formControlName="idRol">
        <mat-option *ngFor="let item of roles" [value]="item.codigo">
          {{ item.descripcion }}
        </mat-option>
      </mat-select>
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions>
    <button mat-button mat-dialog-close type="button">Cancelar</button>
    <button mat-raised-button class="btnsave" type="submit">Grabar</button>
  </mat-dialog-actions>
</form>
