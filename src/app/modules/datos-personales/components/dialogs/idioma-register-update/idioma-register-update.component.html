<form>
    <h1 matDialogTitle>Idiomas</h1>
    <mat-dialog-content>
        <mat-form-field class="w-100" appearance="outline">
            <mat-label>Idioma</mat-label>
            <input matInput required />
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Nivel Escrito</mat-label>
            <mat-select required>
                <mat-option>Basico</mat-option>
                <mat-option>Intermedio</mat-option>
                <mat-option>Avanzado</mat-option>
                <mat-option>Nativo</mat-option>
            </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Nivel Oral</mat-label>
            <mat-select required>
                <mat-option>Basico</mat-option>
                <mat-option>Intermedio</mat-option>
                <mat-option>Avanzado</mat-option>
                <mat-option>Nativo</mat-option>
            </mat-select>
        </mat-form-field>
        
    </mat-dialog-content>
    <mat-dialog-actions>
        <button mat-button mat-dialog-close  class="btnCancel" type="button">&nbsp; Cancelar</button>
        <button mat-raised-button class="btnsave" type="button">&nbsp; Guardar</button>
    </mat-dialog-actions>
</form>
