<form>
    <h1 matDialogTitle>Fromación Académica</h1>
    <mat-dialog-content>
        <mat-form-field appearance="outline">
            <mat-label>Título/Carrera</mat-label>
            <input matInput required />
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Tipo de Estudio</mat-label>
            <mat-select required>
                <mat-option>Inicial</mat-option>
                <mat-option>Primaria</mat-option>
                <mat-option>Secundaria</mat-option>
                <mat-option>Superior Técnico</mat-option>
                <mat-option>Universitario</mat-option>
                <mat-option>PosGrado</mat-option>
                <mat-option>Master</mat-option>
                <mat-option>Doctorado</mat-option>
                <mat-option>Especialidad Médica</mat-option>
                <mat-option>Otro</mat-option>
            </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Institución</mat-label>
            <input matInput />
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Estado</mat-label>
            <mat-select required>
                <mat-option>En Curso</mat-option>
                <mat-option>Graduado</mat-option>
                <mat-option>Abandonado</mat-option>
            </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Fecha Inicio</mat-label>
            <input
                matInput
                required
                formControlName="fechaInicio"
                [max]="maxFecha"
                [matDatepicker]="fechaInicioPicker"
            />
            <mat-datepicker-toggle
                matSuffix
                [for]="fechaInicioPicker"
            ></mat-datepicker-toggle>
            <mat-datepicker
                #fechaInicioPicker
                startView="multi-year"
                [startAt]="startDate"
            ></mat-datepicker>
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Fecha Finalización</mat-label>
            <input
                matInput
                required
                formControlName="fechaFinalizacion"
                [max]="maxFecha"
                [matDatepicker]="fechaFinalizacionPicker"
            />
            <mat-datepicker-toggle
                matSuffix
                [for]="fechaFinalizacionPicker"
            ></mat-datepicker-toggle>
            <mat-datepicker
                #fechaFinalizacionPicker
                startView="multi-year"
                [startAt]="startDate"
            ></mat-datepicker>
        </mat-form-field>
        
    </mat-dialog-content>
    <mat-dialog-actions>
        <button mat-button mat-dialog-close  class="btnCancel" type="button">&nbsp; Cancelar</button>
        <button mat-raised-button class="btnsave" type="button">&nbsp; Guardar</button>
    </mat-dialog-actions>
</form>
