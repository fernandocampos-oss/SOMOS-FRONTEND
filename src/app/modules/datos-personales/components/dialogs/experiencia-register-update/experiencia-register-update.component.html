<form>
    <h1 matDialogTitle>Experiencia Laboral</h1>
    <mat-dialog-content>
        <mat-form-field appearance="outline">
            <mat-label>Empresa</mat-label>
            <input matInput required />
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Puesto</mat-label>
            <input matInput required />
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Nivel de Experiencia</mat-label>
            <mat-select required>
                <mat-option>Training</mat-option>
                <mat-option>Junior</mat-option>
                <mat-option>SemiSenior</mat-option>
                <mat-option>Senior</mat-option>
            </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Institución</mat-label>
            <input matInput required />
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Fecha Inicio</mat-label>
            <input
                matInput
                required
                formControlName="fechaInicio"
                [max]="maxFecha"
                [matDatepicker]="fechaInicioPicker"
            />
            <mat-datepicker-toggle
                matSuffix
                [for]="fechaInicioPicker"
            ></mat-datepicker-toggle>
            <mat-datepicker
                #fechaInicioPicker
                startView="multi-year"
                [startAt]="startDate"
            ></mat-datepicker>
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Fecha Fin</mat-label>
            <input
                matInput
                formControlName="fechaFinalizacion"
                [max]="maxFecha"
                [matDatepicker]="fechaFinalizacionPicker"
            />
            <mat-datepicker-toggle
                matSuffix
                [for]="fechaFinalizacionPicker"
            ></mat-datepicker-toggle>
            <mat-datepicker
                #fechaFinalizacionPicker
                startView="multi-year"
                [startAt]="startDate"
            ></mat-datepicker>
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Personas a cargo</mat-label>
            <input matInput type="number" />
        </mat-form-field>

        <mat-form-field class="w-100" appearance="outline">
            <mat-label>Descripción de Responsabilidades</mat-label>
            <textarea matInput placeholder="Describa sus Responsabilidades"></textarea>
        </mat-form-field>
        
    </mat-dialog-content>
    <mat-dialog-actions>
        <button mat-button mat-dialog-close  class="btnCancel" type="button">&nbsp; Cancelar</button>
        <button mat-raised-button class="btnsave" type="button">&nbsp; Guardar</button>
    </mat-dialog-actions>
</form>
