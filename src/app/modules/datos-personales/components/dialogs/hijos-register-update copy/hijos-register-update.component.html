<form>
    <h1 matDialogTitle>Datos Hijo/a</h1>
    <mat-dialog-content>
        <mat-form-field appearance="outline">
            <mat-label>Nombres</mat-label>
            <input matInput required />
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Apellido Paterno</mat-label>
            <input matInput />
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Apellido Materno</mat-label>
            <input matInput />
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Fecha de nacimiento</mat-label>
            <input
                matInput
                required
                formControlName="fechaNacimiento"
                [max]="maxFechaNacimiento"
                [matDatepicker]="fechaNacimientoPicker"
            />
            <mat-datepicker-toggle
                matSuffix
                [for]="fechaNacimientoPicker"
            ></mat-datepicker-toggle>
            <mat-datepicker
                #fechaNacimientoPicker
                startView="multi-year"
                [startAt]="startDate"
            ></mat-datepicker>
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Grado Instrucción</mat-label>
            <mat-select required>
                <mat-option>Inicial</mat-option>
                <mat-option>Primaria</mat-option>
                <mat-option>Secundaria</mat-option>
                <mat-option>Superior</mat-option>
            </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Sexo</mat-label>
            <mat-select required>
                <mat-option>Masculino</mat-option>
                <mat-option>Femenino</mat-option>
            </mat-select>
        </mat-form-field>
        <mat-form-field appearance="outline">
            <mat-label>Discapacidad</mat-label>
            <mat-select required>
                <mat-option>SI</mat-option>
                <mat-option>NO</mat-option>
            </mat-select>
        </mat-form-field>
        
    </mat-dialog-content>
    <mat-dialog-actions>
        <button mat-button mat-dialog-close  class="btnCancel" type="button">&nbsp; Cancelar</button>
        <button mat-raised-button class="btnsave" type="button">&nbsp; Guardar</button>
    </mat-dialog-actions>
</form>
