<div class="page">
    <div class="page__header">
      <h1 class="page__title">Datos personales<span> <mat-icon>contact_mail</mat-icon> Podrás gestionar tus datos personales, familiares y académidos </span></h1>
      <span class="back"  (click)="back()" > <mat-icon>reply</mat-icon> Regresar</span>
    </div>
    <br>
    <br>
    <div class="page__body">
      <div class="card shadow no-padd">

        <cdk-accordion class="example-accordion">
          <cdk-accordion-item
            #accordionItem1="cdkAccordionItem"
            class="example-accordion-item"
            role="button"
            tabindex="0"
            [attr.id]="'accordion-header-'"
            [attr.aria-expanded]="accordionItem1.expanded"
            [attr.aria-controls]="'accordion-body-'">
            <div class="example-accordion-item-header" (click)="accordionItem1.toggle()">
              <span><mat-icon >record_voice_over</mat-icon>&nbsp; Datos Personales</span>
              <span class="example-accordion-item-description">
               <mat-icon style="color: white;">add</mat-icon>
              </span>
            </div>
            <div
              class="example-accordion-item-body"
              role="region"
              [style.display]="accordionItem1.expanded ? '' : 'none'"
              [attr.id]="'accordion-body-'"
              [attr.aria-labelledby]="'accordion-header-'">
              <app-datos-personales-tab></app-datos-personales-tab>
            </div>
          </cdk-accordion-item>

          <cdk-accordion-item
          
          #accordionItem2="cdkAccordionItem"
          class="example-accordion-item"
          role="button"
          tabindex="0"
          [attr.id]="'accordion-header-'"
          [attr.aria-expanded]="accordionItem2.expanded"
          [attr.aria-controls]="'accordion-body-'">
          <div class="example-accordion-item-header" (click)="accordionItem2.toggle()">
            <span><mat-icon >groups</mat-icon>&nbsp; Datos familiares</span>
            <span class="example-accordion-item-description">
              <mat-icon style="color: white;">add</mat-icon>
            </span>
          </div>
          <div
            class="example-accordion-item-body"
            role="region"
            [style.display]="accordionItem2.expanded ? '' : 'none'"
            [attr.id]="'accordion-body-'"
            [attr.aria-labelledby]="'accordion-header-'">
            <app-datos-familiares></app-datos-familiares>
          </div>
        </cdk-accordion-item>

        <cdk-accordion-item
       
        #accordionItem3="cdkAccordionItem"
        class="example-accordion-item"
        role="button"
        tabindex="0"
        [attr.id]="'accordion-header-'"
        [attr.aria-expanded]="accordionItem3.expanded"
        [attr.aria-controls]="'accordion-body-'">
        <div class="example-accordion-item-header" (click)="accordionItem3.toggle()">
          <span><mat-icon  svgIcon="profesional"></mat-icon> &nbsp; Formación Académica</span>
          <span class="example-accordion-item-description">
            <mat-icon style="color: white;">add</mat-icon>
          </span>
        </div>
        <div
          class="example-accordion-item-body"
          role="region"
          [style.display]="accordionItem3.expanded ? '' : 'none'"
          [attr.id]="'accordion-body-'"
          [attr.aria-labelledby]="'accordion-header-'">
          <app-datos-academicos></app-datos-academicos>
        </div>
      </cdk-accordion-item>
        </cdk-accordion>

          <mat-tab label="Datos de persona">
          <app-datos-personales-tab></app-datos-personales-tab>
          </mat-tab>
          <mat-tab label="Datos familiares">
           <app-datos-familiares></app-datos-familiares>
          </mat-tab>
          <mat-tab label="Datos académidos">
            <app-datos-academicos></app-datos-academicos>
          </mat-tab>
        </mat-tab-group> -->
      </div>
    </div>
  </div>
