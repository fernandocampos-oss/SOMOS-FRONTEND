    <div class="boxBirth">
        <div class="header">
          <mat-grid-list cols="7" rowHeight="50px" gutterSize="6px">
            <mat-grid-tile class="asdf" [colspan]="1" style="left: -1.6%; top: 10%;">
              <mat-form-field class="cambioFecha" appearance="_">
              <input #input matInput disabled [matDatepicker]="picker1" [(value)] = today style="display: none;">
              <mat-datepicker-toggle matSuffix [for]="picker1"matTooltip="Cambiar dia de cumpleaños"></mat-datepicker-toggle>
              <mat-datepicker [disabled]="false" #picker1 (closed)="ActualizarOnomasticos(input.value)" ></mat-datepicker>
              </mat-form-field>
            </mat-grid-tile>
            <mat-grid-tile [colspan]="6">
              <div style="width: 100%; display: inline-flex; align-items: center;">
                <mat-icon >cake</mat-icon><span><b>Cumpleaños el {{input.value}}</b></span>
              </div>
            </mat-grid-tile>
            </mat-grid-list>
        </div>
        <div class="OnomasticosDia">
          <div *ngFor="let items of onomasticos">
            <div class="contenido">
              <div class="num"></div>
              <div class="body">
                <span class="nomBirth">{{items.nombres}}</span><br>
                <span class="areaBirth">{{items.dependencia}}</span>
              </div>
            </div>
          </div>
        </div>
    </div>
    <div class="boxSST" (click)="open(2)">
    </div>
    <div class="boxEncuesta" (click)="open(3)">
      <img src="assets/images/QR_example.png" class="image" alt="Logotipo" /> &nbsp;  &nbsp;

        <span>¡Ingresa y cuéntanos tu opinión!</span>
      </div>
    </div>
    <div class="boxSST-2">
      <div class="info" matTooltip="Gerencia Políticas y Organización del Recurso Humano">
        <span>GPyORH</span>
      </div>
      <div class="info" matTooltip="Gerencia de Administración de Personal">
        <span>GAP</span>
      </div>
      <div class="info" matTooltip="Gerencia de Desarrollo de Personal">
        <span>GDP</span>
      </div>
    </div>
