    <div class="box2" >
      <div class="header">
          <span>Informativo</span>    
      </div>
      <div class="body">
        <div class="boxPublicacion boxBorde" *ngFor="let pub of publicaciones">
          <div class="descrPub">
            <span>{{pub.nombre}}</span>
            <span style="float: right;">{{pub.fechaPub}}</span>
          </div>
          <div>
          <a *ngIf="pub.redireccion != undefined" href='{{pub.redireccion}}' target="_blank"><img class="imgInfo" src='{{pub.imgRuta}}' alt='{{pub.nombre}}'></a>
          <img *ngIf="pub.redireccion == undefined"class="imgInfo" src='{{pub.imgRuta}}' alt='{{pub.nombre}}'></div>
        </div>
      </div>
    </div>

  </div>
  <div class="column1">
    <div class="boxBorde boxBirth">
        <div class="header">
          <mat-grid-list cols="7" rowHeight="50px" gutterSize="6px">
            <mat-grid-tile [colspan]="1" style="left: -1.6%; top: 10%;">
              <mat-form-field class="cambioFecha" appearance="_">
              <input #input matInput disabled [matDatepicker]="picker1" [(value)] = today style="display: none;">
              <mat-datepicker-toggle matSuffix [for]="picker1"matTooltip="Cambiar dia de cumpleaños"></mat-datepicker-toggle>
              <mat-datepicker [disabled]="false" #picker1 (closed)="ActualizarOnomasticos(input.value)" ></mat-datepicker>
              </mat-form-field>
            </mat-grid-tile>
            <mat-grid-tile [colspan]="6">
              <div style="width: 100%; display: inline-flex; align-items: center;">
                <mat-icon >cake</mat-icon><span><b>Cumpleaños el {{input.value}}</b></span>
              </div>
            </mat-grid-tile>
            </mat-grid-list>
        </div>
        <div class="OnomasticosDia">
          <div *ngFor="let items of onomasticos">
            <div class="contenido">
              <div class="num"></div>
              <div class="body">
                <span class="nomBirth">{{items.nombres}}</span><br>
                <span class="areaBirth">{{items.dependencia}}</span>
              </div>
            </div>
          </div>
        </div>
    </div>
    <div class="boxBorde boxSST" (click)="open(2)">
    </div>
