<h4>{{data.obj.titulo}}</h4>
<a *ngIf="data.obj.urlRedireccion !== '' " href='{{data.obj.urlRedireccion}}' target="_blank"><img class="imgInfo boxBorde" src='data:image/jpeg;base64,{{data.obj.imagenBase64}}' alt='{{data.obj.titulo}}'></a>
<img *ngIf="data.obj.urlRedireccion === '' " class="imgInfo boxBorde" src='data:image/jpeg;base64,{{data.obj.imagenBase64}}' alt='{{data.obj.titulo}}'>
