<div *ngIf="!infoDialog.enviado">
    <div class="alignContent">
        <h3>Usted va a inscribirse a la siguiente campaña:</h3>
    </div>
    <div class="alignContent">
        <span>{{infoDialog.descripcion}}</span>
    </div>
    <div class="alignContent">
        <img class="imgInfo" src='data:image/jpeg;base64,{{data.pubData.imagenBase64}}' alt='{{data.pubData.titulo}}'>
    </div>
    <div class="alignContent">
        <h5>Una vez confirmado, no se podrá deshacer</h5>
    </div>
    <mat-grid-list cols="2" rowHeight="40px" gutterSize="6px">
        <mat-grid-tile [colspan]="1" class="grid">
            <button mat-button matDialogClose class="boton">Volver</button>
        </mat-grid-tile>
        <mat-grid-tile [colspan]="1" class="grid">
            <button mat-raised-button (click)="enviarInscripcion()" color="primary" class="boton confirm">Confirmar</button>
        </mat-grid-tile>
    </mat-grid-list>
</div>
<div *ngIf="infoDialog.enviado">
    <div class="alignContent">
        <img class="imgConfirmacion" src="assets/images/surveyCheck.png">
    </div>
    <div class="alignContent">
        <h5>¡Se encuentra inscrito en la campaña!</h5>
    </div>
    <div class="alignContent">
        <span>{{infoDialog.descripcion}}</span>
    </div>
    <mat-dialog-actions align="center">
            <button mat-raised-button mat-dialog-close color="primary" class="boton confirm">Cerrar</button>
    </mat-dialog-actions>
</div>
