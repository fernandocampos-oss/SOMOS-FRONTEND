<div class="contenedor">
   <div class="header"><b>Cronograma de Pagos - {{ currentYear }}</b></div>
   <button mat-icon-button mat-dialog-close color="warn" class="closeButton" aria-label="Example icon button with a heart icon">
     X
   </button>
   <mat-button-toggle-group #group="matButtonToggleGroup" (change)="onToggleChange($event)" class="optPagos" [value]="contractTypeId">
       <mat-button-toggle *ngFor="let type of contractTypesList" [value]="type.idTipoContrato" aria-label="Text align left">
         <span>{{ type.descripcion }}</span>
       </mat-button-toggle>
   </mat-button-toggle-group>
   
   <mat-grid-list cols="6" rowHeight="35px" gutterSize="0px" class="tablaContenidos" *ngIf="paymentScheduleList.length > 0">
       <div *ngFor="let item of paymentScheduleFilteredList, index as i">
           <mat-grid-tile [colspan]="2" class="periodosPago txtCenter">
              <span>{{ item.descripcionPeriodo }}</span>
           </mat-grid-tile>
           <mat-grid-tile [colspan]="4" class="dataPago">
               <span>{{ item.fecha ? (item.fecha | date:'EEEE' | titlecase) : '-' }} - {{ item.fecha ? (item.fecha | date:'dd' | titlecase ) : '-' }}</span>
           </mat-grid-tile>
       </div>
   </mat-grid-list>
</div>
