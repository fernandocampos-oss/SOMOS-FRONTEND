<h2 mat-dialog-title class="dialog-header" style="text-align: center;">
    CONOCE NUESTROS DOCUMENTOS DE GESTIÓN EN SEGURIDAD Y SALUD EN EL TRABAJO
</h2>
<mat-dialog-content [formGroup]="form">
    <br>
    <div formArrayName="documentos">
        <div *ngFor="let doc of documentos; let i = index" class="doc-item">
            <mat-checkbox [formControlName]="i">
                {{doc.titulo}}
                (<a [href]="doc.archivo" target="_blank" class="link-ver">ver aquí</a>)
            </mat-checkbox>
        </div>
    </div>
</mat-dialog-content>

<mat-dialog-actions align="center">
    <button mat-raised-button class="btn-aceptar" [disabled]="!allChecked()" (click)="aceptar()">
        ACEPTAR
    </button>
</mat-dialog-actions>
