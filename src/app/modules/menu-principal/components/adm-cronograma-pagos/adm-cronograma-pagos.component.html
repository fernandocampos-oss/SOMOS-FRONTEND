<div class="header">
  <b>Cronograma de Pagos - {{ currentYear }}</b>
  <button mat-icon-button mat-dialog-close color="warn" class="closeButton" aria-label="Cerrar">
    X
  </button>
</div>

<mat-button-toggle-group #group="matButtonToggleGroup" (change)="onToggleChange($event)" class="optPagos" [value]="contractTypeId">
  <mat-button-toggle *ngFor="let type of contractTypesList" [value]="type.idTipoContrato" aria-label="Text align left">
    <span>{{ type.descripcion }}</span>
  </mat-button-toggle>
</mat-button-toggle-group>

<form [formGroup]="dateFormList[i]" *ngFor="let form of dateFormList; let i = index" >
  <ng-container *ngIf="contractTypeId == i + 1">
    <ng-container *ngFor="let schedule of getPaymentScheduleFilteredList(i)" class="form-field-container">
      <div class="mat-form-field-div" [@fadeInOut]>
        <mat-form-field style="margin-top: 14px;">
          <mat-label>{{ schedule.descripcionPeriodo }}</mat-label>
          <input matInput [matDatepicker]="picker" [min]="schedule.fechaMinima" [max]="schedule.fechaMaxima" [disabled]="!schedule.requerido"
                 [formControlName]="schedule.idCronogramaPago + 'Schedule'">
          <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
          <mat-datepicker #picker></mat-datepicker>
        </mat-form-field>
        <mat-form-field appearance="fill">
          <mat-label>Tipos de boletas asociadas</mat-label>
          <mat-select [formControl]="dateFormList[i].get(schedule.idCronogramaPago + 'SchedulePaymentTypes')" [disabled]="!schedule.requerido" multiple>
            <mat-option *ngFor="let type of paymentTypesList" [value]="type.idTipoBoleta">{{type.descripcion}}</mat-option>
          </mat-select>
        </mat-form-field>
      </div>
    </ng-container>
  </ng-container>
</form>
<div *ngFor="let form of dateFormList; let i = index" class="div-btn-save">
  <ng-container *ngIf="contractTypeId == i + 1">
    <button [@fadeInOut] mat-raised-button color="primary" *ngIf="dateFormList.length > 0" (click)="saveChanges()">
      <mat-icon>save</mat-icon> Guardar cambios
    </button>
  </ng-container>
</div>
