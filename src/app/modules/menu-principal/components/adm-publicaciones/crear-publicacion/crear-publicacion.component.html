<div [formGroup]="form">
    <mat-grid-list cols="6" rowHeight="20px">
        <mat-grid-tile [colspan]="6" [rowspan]="2">
            <h3>Añadir Publicación</h3>
        </mat-grid-tile>
        <mat-grid-tile class="cargaImg" [colspan]="2" gutterSize="2px" [rowspan]="18">
            <div class="imageBox">
                <button type="button" class="preview__button btnColor" mat-raised-button MatPrefix
                    (click)="file.click()" color="primary" *ngIf="!retrievedImage">
                    <mat-icon>add_photo_alternate</mat-icon> Cargar Imagen
                </button>
                <button type="button" class="preview__button" mat-raised-button MatPrefix (click)="removeImage()"
                    color="warn" *ngIf="retrievedImage">
                    <mat-icon>clear</mat-icon> Remover Imagen
                </button>
                <input hidden #file type="file" accept="Image/*" (change)="onChangeImage(file.files)" />
                <img class="preview__img" [src]="retrievedImage" *ngIf="retrievedImage" />
            </div>
        </mat-grid-tile>
        <mat-grid-tile class="boxEspaciado" [colspan]="4" [rowspan]="4">
            <mat-form-field appearance="outline">
                <mat-label>Título de la publicación</mat-label>
                <input matInput required formControlName="frmTitulo" />
            </mat-form-field>
        </mat-grid-tile>
        <mat-grid-tile class="boxEspaciado" [colspan]="4" [rowspan]="5">
            <mat-form-field appearance="outline">
                <mat-label>Descripcion de la publicación</mat-label>
                <textarea matInput required formControlName="frmDescripcion"></textarea>
            </mat-form-field>
        </mat-grid-tile>
        <mat-grid-tile class="boxEspaciado" [colspan]="4" [rowspan]="4">
            <mat-form-field appearance="outline">
                <mat-label>Enlace externo de la publicación (Opcional)</mat-label>
                <input matInput formControlName="frmEnlace" />
            </mat-form-field>
        </mat-grid-tile>

        <!-- rol 3 y 4 -->
        <div *ngIf="rolRed == rolTemporal_3 && rolCentral == rolTemporal_4">
            <!-- <mat-grid-tile class="boxEspaciado" [colspan]="4" [rowspan]="4">
                <mat-form-field appearance="outline">
                    <mat-label>Seleccione alcance</mat-label>
                    <mat-select [(value)]="selected" (selectionChange)="capturaValorGlobal($event)">
                        <mat-option value="opcion_1">Alcance global</mat-option>
                        <mat-option value="opcion_2">Alcance de red asistencial</mat-option>
                    </mat-select>
                </mat-form-field>
            </mat-grid-tile>

            <div *ngIf="selected ==='opcion_2'">
                <mat-grid-tile class="boxEspaciado" [colspan]="4" [rowspan]="4">
                    <mat-form-field appearance="outline">
                        <mat-label>Seleccione red asistencial</mat-label>
                        <mat-select [(ngModel)]="selectedItems" [ngModelOptions]="{standalone: true}" multiple>
                            <mat-option *ngFor="let red of listRedes" [value]="red.codRed">
                                {{red.descripcion}}
                            </mat-option>
                        </mat-select>
                    </mat-form-field>
                </mat-grid-tile>
            </div> -->
            <mat-grid-tile class="boxEspaciado" [colspan]="4" [rowspan]="4">
                <mat-form-field appearance="outline">
                    <mat-label>Redes Asignadas</mat-label>
                    <mat-select [(ngModel)]="redItemSeleccionadoRol_3_4" [ngModelOptions]="{standalone: true}">
                        <mat-option *ngFor="let r of listRedesAsignadas" [value]="r.codRed">
                            {{ r.descripcion }}
                        </mat-option>
                    </mat-select>
                </mat-form-field>
            </mat-grid-tile>
        </div>

        <!-- rol 3 -->
        <div *ngIf="rolTemporal_3 == 3 && rolTemporal_4 == null">
            <mat-grid-tile class="boxEspaciado" [colspan]="4" [rowspan]="4">
                <mat-form-field appearance="outline">
                    <mat-label>Redes Asignadas</mat-label>
                    <mat-select [(ngModel)]="redItemSeleccionadoRol_3" [ngModelOptions]="{standalone: true}">
                        <mat-option *ngFor="let r of listRedesAsignadas" [value]="r.codRed">
                            {{ r.descripcion }}
                        </mat-option>
                    </mat-select>
                </mat-form-field>
            </mat-grid-tile>
        </div>

    </mat-grid-list>
    <mat-dialog-actions align="end">
        <button mat-button mat-dialog-close type="button">Cancelar</button>
        <!-- rol 3 -->
        <button mat-raised-button class="btnColor" *ngIf="rolTemporal_3 == 3 && rolTemporal_4 == null" (click)="registrarPublicacion_rol_3()">
            <mat-icon>add</mat-icon>
            Guardar
        </button>
        <!-- rol 3 y 4  -->
        <button mat-raised-button class="btnColor" *ngIf="rolTemporal_3 == 3 && rolTemporal_4 == 4" (click)="registrarPublicacion_rol_4_3()">
            <mat-icon>add</mat-icon>
            Guardar
        </button>
    </mat-dialog-actions>
</div>
