<form [formGroup]="form">
  <h2 mat-dialog-title>Registrar Evidencia</h2>
  <mat-dialog-content>
    <mat-form-field appearance="outline">
      <mat-label>Descripción de la evidencia</mat-label>
      <textarea matInput (keyup)="onKey($event)" formControlName="frmDescripcion" rows="5" type="text" minlength="15"
        maxlength="300" required>
        </textarea>
      <mat-hint align="end">Máx. {{contadorTxtArea}} / 300</mat-hint>
    </mat-form-field>
    <br>

    <div class="datosPdf">
      <button type="button" class="preview__button btnOptionsActive" mat-raised-button MatPrefix
        (click)="filePdf.click()" color="primary" *ngIf="!retrievedPdf">
        <mat-icon>attach_file</mat-icon> Cargar PDF <strong>(Máx. 4MB)</strong>
      </button>
      <button type="button" class="preview__button" mat-raised-button MatPrefix (click)="removePdf()" color="warn"
        *ngIf="retrievedPdf">
        <mat-icon>clear</mat-icon> Remover Archivo
      </button>
    </div>
    <div>
      <h5 *ngIf="retrievedPdf">{{nombrePdf}}</h5>
      <img class="preview__img" src="assets/images/pdfSelected.png" *ngIf="retrievedPdf" (click)='downloadPdf()'
        matTooltip="Descargar PDF" matTooltipPosition="right" style='cursor: pointer;' />
      <img class="preview__img" src="assets/images/pdfPlaceholder.png" *ngIf="!retrievedPdf" />
    </div>
    <input hidden #filePdf type="file" name="Upload" accept="application/pdf" (change)="onChangeFilePdf(filePdf.files)">
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button mat-dialog-close type="button">Cancelar</button>
    <button mat-raised-button class="btnsave" type="submit" (click)="registrarEvidencia()"
      [disabled]="this.pdfExtension === ''">Enviar</button>
  </mat-dialog-actions>
</form>
