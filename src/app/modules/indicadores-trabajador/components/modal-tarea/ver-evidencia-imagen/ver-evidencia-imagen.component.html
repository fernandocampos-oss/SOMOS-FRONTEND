<h4>Descripción de la evidencia:</h4>
<h4>{{evidenciaDescripcion}}</h4>
<img class="imgInfo boxBorde" src='data:image/jpeg;base64,{{fileBase64}}'>

<mat-dialog-actions align="end">
  <button mat-button *ngIf="fileBase64 != null" class="has-success" (click)="downloadFile()">
    <mat-icon>get_app</mat-icon>
    &nbsp; Descargar
  </button>
  <button mat-button mat-dialog-close class="close-button">Cerrar</button>
</mat-dialog-actions>
