<h3>Evidencias Asignadas</h3><br>
<mat-dialog-content>
    <table mat-table [dataSource]="dataSource_tarea" style="width:100%">
        <ng-container matColumnDef="item">
            <th mat-header-cell *matHeaderCellDef>N°</th>
            <td mat-cell *matCellDef="let element, index as i">{{i+1}}</td>
        </ng-container>
        <ng-container matColumnDef="nombre_tarea">
            <th mat-header-cell *matHeaderCellDef>Evidencia</th>
            <td mat-cell *matCellDef="let element"> {{element.descripcion}} </td>
        </ng-container>
        <ng-container matColumnDef="plazo">
            <th mat-header-cell *matHeaderCellDef>Plazo máximo</th>
            <td mat-cell *matCellDef="let element"> {{element.plazo | date: 'dd-MM-yyyy'}} </td>
        </ng-container>
        <ng-container matColumnDef="fecha_asignacion">
            <th mat-header-cell *matHeaderCellDef>Fecha de asignación</th>
            <td mat-cell *matCellDef="let element"> {{element.fechaCreacion | date: 'dd-MM-yyyy'}} </td>
        </ng-container>
        <ng-container matColumnDef="acciones">
            <th mat-header-cell *matHeaderCellDef width="150px">Acciones</th>
            <td mat-cell *matCellDef="let element">
                <button mat-icon-button class="has-success" matTooltip="Agregar Evidencia"
                    [disabled]="element.sustentoExtensionFile !==null" (click)="registrarEvidencia(element)">
                    <mat-icon>add_circle</mat-icon>
                </button>
                <button mat-icon-button class="primary-button" matTooltip="Ver Imagen"
                    [disabled]="element.sustentoExtensionFile !=='png'" (click)="verImagenEvidencia(element)">
                    <mat-icon>image</mat-icon>
                </button>
                <button mat-icon-button class="primary-button" matTooltip="Ver PDF"
                    [disabled]="element.sustentoExtensionFile !=='pdf'" (click)="verEvidenciaPdf(element)">
                    <mat-icon>picture_as_pdf</mat-icon>
                </button>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        <tr class="empty-row" *matNoDataRow>
            <td class="empty-cell">Aún no tienes tareas asignadas</td>
        </tr>
    </table>

</mat-dialog-content>
<mat-dialog-actions align="end">
    <button mat-button mat-dialog-close class="close-button">Cerrar</button>
</mat-dialog-actions>
