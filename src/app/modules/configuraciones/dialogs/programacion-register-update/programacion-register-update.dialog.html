<form [formGroup]="form" (ngSubmit)="onSave()">
  <h1 matDialogTitle>Programación</h1>
  <mat-dialog-content>
    <mat-form-field appearance="outline">
      <mat-label>Descripción</mat-label>
      <input matInput required formControlName="descripcion" />
      <mat-icon matPrefix>description &nbsp;</mat-icon>
    </mat-form-field>
    <mat-form-field *appRole="roleAdminCentral" appearance="outline">
      <mat-label>Sede</mat-label>
      <mat-select [formControl]="sedeCtrl" required>
        <mat-option *ngFor="let item of sedes" [value]="item.codigo">
          {{ item.descripcion }}
        </mat-option>
      </mat-select>
      <mat-icon matPrefix>location_on &nbsp;</mat-icon>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Zona</mat-label>
      <mat-select required formControlName="idZona">
        <mat-option *ngFor="let item of zonas" [value]="item.idZona">
          {{ item.descripcion }}
        </mat-option>
      </mat-select>
      <mat-icon matPrefix>location_on &nbsp;</mat-icon>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Fecha Inicio</mat-label>
      <input
        matInput
        required
        formControlName="fechaInicio"
        type="datetime-local"
      />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Fecha Fin</mat-label>
      <input
        matInput
        required
        formControlName="fechaFin"
        type="datetime-local"
      />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Tipo QR</mat-label>
      <mat-select required formControlName="idTipoQr">
        <mat-option *ngFor="let item of tiposQr" [value]="item.codigo">
          {{ item.descripcion }}
        </mat-option>
      </mat-select>
      <mat-icon class="icon" matPrefix  svgIcon="qr_code"> </mat-icon>
    </mat-form-field>
    <mat-form-field *ngIf="isDigital" appearance="outline">
      <mat-label>Intervalo Actualización (Segundos)</mat-label>
      <input matInput type="number" required formControlName="secondRefresh" />
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions>
    <button mat-button mat-dialog-close class="btnCancel" type="button"><mat-icon class="icon" matPrefix  svgIcon="cancel"></mat-icon>Cancelar</button>
    <button mat-raised-button class="btnsave" type="submit"><mat-icon class="icon" matPrefix  svgIcon="save"></mat-icon>Grabar</button>
  </mat-dialog-actions>
</form>
