<form [formGroup]="form" (ngSubmit)="onSave()">
  <h1 matDialogTitle>Marcación</h1>
  <mat-dialog-content>
    <mat-form-field class="w-100" appearance="outline">
      <mat-label>Usuario</mat-label>
      
      <mat-select required formControlName="idUsuario">
        <mat-option *ngFor="let option of users" [value]="option.idUsuario">
          {{option.nombresCompletos}}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Fecha de Marcación</mat-label>

      <input
        matInput
        required
        formControlName="fechaMarcacion"
        type="datetime-local"
      />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Tipo de Marcación</mat-label>

      <mat-select required formControlName="idTipoMarcacion">
        <mat-option *ngFor="let item of tiposMarcacion" [value]="item.codigo">
          {{ item.descripcion }}
        </mat-option>
      </mat-select>
    </mat-form-field>
    <mat-form-field *appRole="roleAdminCentral" appearance="outline">
      <mat-label>Sede</mat-label>
      <mat-select [formControl]="sedeCtrl" required>
        <mat-option *ngFor="let item of sedes" [value]="item.codigo">
          {{ item.descripcion }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Zona</mat-label>
      <mat-select
        formControlName="idZona"
        required
      >
        <mat-option *ngFor="let item of zonas" [value]="item.idZona">
          {{ item.descripcion }}
        </mat-option>
      </mat-select>
    </mat-form-field>


    <mat-form-field appearance="outline">
      <mat-label>Latitud</mat-label>

      <input
        matInput
        type="number"
        class="hide-spinner"
        formControlName="latitud"
      />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Longitud</mat-label>

      <input
        matInput
        type="number"
        class="hide-spinner"
        formControlName="longitud"
      />
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions>
    <button mat-button mat-dialog-close type="button">Cancelar</button>
    <button mat-raised-button cdkFocusInitial class="btnsave" type="submit">
      Grabar
    </button>
  </mat-dialog-actions>
</form>
