<div class="page">
  <div class="matero-page-header">
    <h1 class="matero-page-title"><mat-icon>insert_drive_file</mat-icon> Declaración Jurada de Conflicto de Intereses<br>
    <small class="mr-2">Realiza aqui tu declaración jurada de inicio o modificatoria.</small><br>
    <span class="back" (click)="back()" > <mat-icon>reply</mat-icon> Regresar</span>
    </h1>
  </div>
  <div class="page__body">
    <div class="card shadow">        
      <mat-tab-group class="tab-group">
          <mat-tab style="padding: 5rem;">
              <ng-template mat-tab-label>
                  <mat-icon>folder_open</mat-icon>&nbsp;&nbsp;Declaraciones Juradas
              </ng-template>
              <br><br>    
              <app-crud
                  [data]="djConflictoList"
                  [columns]="djConflictoColumns"
                  (create)="onCreateDjConflicto()"
                  (download)="onDownload($event)"
                  [showEdit]="false"
                  [showDelete]="false"
                  [showDownload]="true"
              ></app-crud>
          </mat-tab>
      </mat-tab-group>     
  </div>
</div>
