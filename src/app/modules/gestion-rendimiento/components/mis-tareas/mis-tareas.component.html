<div class="actions">
    <button mat-raised-button class="nuevo-button" matTooltip="Agregar Tarea" (click)="showDialogAddTask()">
        <mat-icon>add_circle</mat-icon>&nbsp; Agregar Tarea</button>
</div>
<table mat-table [dataSource]="dataSource" style="width:100%" matSort>

    <ng-container matColumnDef="item">
        <th mat-header-cell *matHeaderCellDef mat-sort-header width="100px"> Item </th>
        <td mat-cell *matCellDef="let element, index as i"> {{i+1}} </td>
    </ng-container>

    <ng-container matColumnDef="descripcion">
        <th mat-header-cell *matHeaderCellDef mat-sort-header width="200px"> Descripción de la Evidencia Solicitada
        </th>
        <td mat-cell *matCellDef="let element"> {{element.descripcion}} </td>
    </ng-container>

    <ng-container matColumnDef="avance">
        <th mat-header-cell *matHeaderCellDef width="100px"> % de avance </th>
        <td mat-cell *matCellDef="let element">            
            <div style="text-align: center; width: 85%">
                {{element.porcentajeAvance}}%
                <mat-progress-bar mode="determinate" [value]="element.avance"></mat-progress-bar>
            </div>
        </td>
    </ng-container>

    <ng-container matColumnDef="plazo">
        <th mat-header-cell *matHeaderCellDef mat-sort-header width="100px"> Plazo Máximo </th>
        <td mat-cell *matCellDef="let element"> {{element.plazo | date: 'dd-MM-yyyy'}} </td>
    </ng-container>

    <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef mat-sort-header width="100px"> Estado </th>
        <td mat-cell *matCellDef="let element"> {{element.estado}} </td>
    </ng-container>

    <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef width="120px"> Acciones </th>
        <td mat-cell *matCellDef="let element, index as i">
            <button mat-icon-button color="primary" matTooltip="Ver Tarea" (click)="showDialogDownloadTask(element, i)">
                <mat-icon>remove_red_eye</mat-icon></button>
            <button mat-icon-button color="primary" matTooltip="Informar" (click)="showDialogReportTask(element)">
                <mat-icon>add</mat-icon></button>
        </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    <tr class="empty-row" *matNoDataRow>
        <td class="empty-cell">Sin registros por mostrar</td>
    </tr>
</table>
<mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
