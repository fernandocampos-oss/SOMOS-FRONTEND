    <!-- formControlName="frmArea" -->
    <mat-form-field class="example-full-width">
        <mat-label>Unidad Organizacional</mat-label>
        <input type="text" placeholder="Escriba un nombre de unidad" matInput [formControl]="myControlUnidad"
          [matAutocomplete]="autoUnidad">
        <mat-autocomplete #autoUnidad="matAutocomplete" [displayWith]="displayFnUnidad"
          (optionSelected)="onSelectionChangeUnidad($event)">
          <mat-option *ngFor="let u of filteredOptionsUnidad | async" [value]="u">
            {{u.descripcion}}
          </mat-option>
        </mat-autocomplete>
      </mat-form-field>
    <br>
    <mat-form-field appearance="outline">
        <textarea matInput placeholder="Motivo" formControlName="frmMotivo" type="text" rows="4" minlength="5" maxlength="150" required></textarea>
    </mat-form-field>
    <mat-dialog-actions align="end">
        <button mat-button mat-dialog-close>Cerrar</button>
        <button mat-raised-button color="primary" (click)="derivarRequiremento()" mat-dialog-close>Enviar</button>
    </mat-dialog-actions>
</form>
