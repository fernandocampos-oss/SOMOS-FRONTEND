<h3>¿A qué área desea derivar este requerimiento?</h3><br>
<form [formGroup]="form_cambio">
    <mat-form-field appearance="outline">
        <mat-label>Áreas</mat-label>
        <mat-select formControlName="frmArea">
            <mat-option value="SGSASS">SGSASS</mat-option>
            <mat-option value="SGSA">SGSA</mat-option>
            <mat-option value="SGSI">SGSI</mat-option>
            <mat-option value="SGOTI">SGOTI</mat-option>
            <mat-option value="SGC">SGC</mat-option>
            <mat-option value="OSI">OSI</mat-option>
        </mat-select>
    </mat-form-field>
    <br>
    <mat-form-field appearance="outline">
        <textarea matInput placeholder="Motivo" formControlName="frmMotivo" type="text" rows="4" minlength="5" maxlength="150" required></textarea>
    </mat-form-field>
    <mat-dialog-actions align="end">
        <button mat-button mat-dialog-close>Cerrar</button>
        <button mat-raised-button color="primary" (click)="moveRequirement()" mat-dialog-close>Enviar</button>
    </mat-dialog-actions>
</form>
