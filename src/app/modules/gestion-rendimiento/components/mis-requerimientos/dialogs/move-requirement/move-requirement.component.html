<h3>¿A que área desea derivar este requerimiento?</h3><br>
<form class="form" [formGroup]="form_cambio">
    <mat-form-field appearance="outline">
        <mat-label>Áreas</mat-label>
        <mat-select formControlName="frmArea">
                    <mat-option value="1">SGSASS</mat-option>
                    <mat-option value="2">SGSA</mat-option>
                    <mat-option value="3">SGSI</mat-option>
                    <mat-option value="4">SGOTI</mat-option>
                    <mat-option value="5">SGC</mat-option>
                    <mat-option value="6">OSI</mat-option>
        </mat-select>
            </mat-form-field>
    <mat-dialog-actions align="end">
            <button mat-button mat-dialog-close>Cerrar</button>
            <button mat-raised-button color="primary">Enviar</button>
    </mat-dialog-actions>
</form>
