<h3>{{ requerimiento }}</h3><br>
<mat-dialog-content>
    <form [formGroup]="form">
        <mat-grid-list cols="6" rowHeight="90px" gutterSize="6px">
            <mat-grid-tile [colspan]="6">
                <mat-form-field appearance="outline">
                    <mat-label>Descripción del Requerimiento</mat-label>
                    <!-- <input matInput formControlName="frmDescripcion" readonly> -->
                    <textarea matInput formControlName="frmDescripcion" readonly></textarea>
                </mat-form-field>
            </mat-grid-tile>
            <mat-grid-tile [colspan]="6">
                <mat-form-field appearance="outline">
                    <mat-label>Identificador</mat-label>
                    <input matInput formControlName="frmIdentificador" readonly>
                </mat-form-field>
            </mat-grid-tile>            
            <mat-grid-tile [colspan]="3">
                <mat-form-field appearance="outline">
                    <mat-label>Área solicitante</mat-label>
                    <input matInput formControlName="frmAreaSolicitante" readonly>
                </mat-form-field>
            </mat-grid-tile>
            <mat-grid-tile [colspan]="3">
                <mat-form-field appearance="outline">
                    <mat-label>Área que atiende el requerimiento</mat-label>
                    <input matInput formControlName="frmAreaDestinatario" readonly>
                </mat-form-field>
            </mat-grid-tile>
            <!-- <mat-grid-tile [colspan]="5" class="grid">
                <mat-form-field appearance="outline">
                    <mat-label>Actividades del POI a asignar</mat-label>
                    <mat-select [(value)]="descripcionPoi">
                        <mat-option *ngFor="let poi of pois" [value] = "poi.descripcion">{{poi.descripcion}}</mat-option>
                    </mat-select>
                </mat-form-field>
            </mat-grid-tile>
            <mat-grid-tile [colspan]="1">
                <button mat-raised-button color="primary" class="aniadir" (click)="onPoiCreate()">Añadir</button>
            </mat-grid-tile> -->
        </mat-grid-list>
        <mat-form-field *ngIf="estadoReq == 'DERIVADO'" appearance="outline">
                <mat-label>Motivo de derivación</mat-label>
                <textarea matInput formControlName="frmMotivo" readonly></textarea>
            </mat-form-field>
        <mat-form-field *ngIf="estadoReq == 'RECHAZADO'" appearance="outline">
                <mat-label>Motivo de rechazo</mat-label>
                <textarea matInput formControlName="frmMotivo" readonly></textarea>
            </mat-form-field>
    </form>
