<table mat-table [dataSource]="dataSource" style="width:100%" matSort>
            
    <ng-container matColumnDef="Item">
        <th mat-header-cell *matHeaderCellDef mat-sort-header width="100px"> Item </th>
        <td mat-cell *matCellDef="let element"> {{element.item}} </td>
    </ng-container>

    <ng-container matColumnDef="Nombre del Requerimiento">
        <th mat-header-cell *matHeaderCellDef mat-sort-header width="200px"> Nombre del Requerimiento </th>
        <td mat-cell *matCellDef="let element"> {{element.descripcion}} </td>
    </ng-container>

    <ng-container matColumnDef="Gerencia Solicitante">
        <th mat-header-cell *matHeaderCellDef width="100px"> Gerencia Solicitante </th>
        <td mat-cell *matCellDef="let element"> {{element.avance}} %</td>
    </ng-container>

    <ng-container matColumnDef="Estado">
        <th mat-header-cell *matHeaderCellDef mat-sort-header width="100px"> Estado </th>
        <td mat-cell *matCellDef="let element"> {{element.estado}} </td>
    </ng-container>

    <ng-container matColumnDef="Acciones">
        <th mat-header-cell *matHeaderCellDef width="120px" > Acciones </th>
        <td mat-cell *matCellDef="let element"> 
            <button mat-icon-button color="primary" matTooltip="Ver Requerimiento" (click)="showDialogReadRequirement(element)">
                <mat-icon>remove_red_eye</mat-icon>
            </button>
            <button mat-icon-button color="primary" matTooltip="Solicitud" (click)="showDialogSolicitud(element)">
                <mat-icon>settings</mat-icon>
            </button>
            <button mat-icon-button color="primary" *ngIf="element.idEstado ==1" matTooltip="Aprobar" (click)="showDialogConfirmAccept(element)">
                <mat-icon>check</mat-icon>
            </button>
            <button mat-icon-button color="primary" matTooltip="Rechazar" (click)="showDialogDissaproveRequirement(element)">
                <mat-icon>cancel</mat-icon>
            </button>
            <button mat-icon-button color="primary" matTooltip="Derivar a otra área" (click)="showDialogMoveRequirement(element)">
                <mat-icon>subdirectory_arrow_right</mat-icon>
            </button>
        </td>
    </ng-container>
  
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    <tr class="empty-row" *matNoDataRow>
      <td class="empty-cell">Sin registros por mostrar</td>
    </tr>
  </table>
  <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
