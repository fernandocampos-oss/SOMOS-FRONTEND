<h3>Editar Evidencia</h3><br>
<mat-dialog-content>
    <mat-grid-list cols="6" rowHeight="110px" gutterSize="6px">
        <mat-grid-tile [colspan]="6">
            <mat-form-field appearance="outline">
                <mat-label>Descripción</mat-label>
                <textarea matInput [(ngModel)]="evidencia.descripcion" maxlength="250" required></textarea>
            </mat-form-field>
        </mat-grid-tile>
        <mat-grid-tile [colspan]="2">
            <mat-form-field appearance="outline">
                <mat-label>Nuevo plazo</mat-label>
                <input matInput [(ngModel)]="evidencia.plazo" [min]="minFechaEvidencia" [matDatepicker]="fechaEvidenciaPicker"
                    (focus)="fechaEvidenciaPicker.open()" required/>
                <mat-datepicker-toggle matSuffix [for]="fechaEvidenciaPicker"></mat-datepicker-toggle>
                <mat-datepicker #fechaEvidenciaPicker></mat-datepicker>
            </mat-form-field>
        </mat-grid-tile>

        

    </mat-grid-list>
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button mat-button mat-dialog-close>Cancelar</button>
    <button mat-raised-button class="save-button" (click)="modificarEvidencia()">Actualizar</button>
</mat-dialog-actions>
