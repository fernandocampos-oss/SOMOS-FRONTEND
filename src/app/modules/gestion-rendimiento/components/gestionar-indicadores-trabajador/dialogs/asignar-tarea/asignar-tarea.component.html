<h3 class="auth__subtitle">Solicitud para un sistema de Gestión del Rendimiento</h3><br>
<form [formGroup]="formTareasListadas">
    <ng-template matStepLabel>Tareas</ng-template>
    <br>
    <h4>Indicador elegido: {{data.element.nombreIndicador}}</h4>
    <mat-grid-list cols="6" rowHeight="90px" gutterSize="6px">
        <mat-grid-tile [colspan]="6">
            <mat-form-field appearance="outline">
                <mat-label>Tarea a realizar</mat-label>
                <input matInput formControlName="frmDescTarea">
            </mat-form-field>
        </mat-grid-tile>
        <mat-grid-tile [colspan]="5">
            <mat-form-field appearance="outline">
                <mat-label>Plazo máximo</mat-label>
                <input matInput formControlName="frmDateTarea" [min]="minFechaTarea"
                    [matDatepicker]="fechaTareaPicker" />
                <mat-datepicker-toggle matSuffix [for]="fechaTareaPicker"></mat-datepicker-toggle>
                <mat-datepicker #fechaTareaPicker></mat-datepicker>
            </mat-form-field>
        </mat-grid-tile>
        <mat-grid-tile [colspan]="1">
            <button mat-raised-button color="primary" class="botonPoi"
                (click)="crearTareaSinActividad(); formTareasListadas.reset()">Añadir</button>
        </mat-grid-tile>
    </mat-grid-list>
    <div style="max-height: 260px; overflow-y: auto;">
        <table mat-table [dataSource]="dataSource" style="width:100%">
            <ng-container matColumnDef="item">
                <th mat-header-cell *matHeaderCellDef width="15%">N°</th>
                <td mat-cell *matCellDef="let element, index as i"> {{i+1}} </td>
            </ng-container>
            <ng-container matColumnDef="tarea">
                <th mat-header-cell *matHeaderCellDef width="25%"> Tarea </th>
                <td mat-cell *matCellDef="let element"> {{element.nombreTarea}} </td>
            </ng-container>
            <ng-container matColumnDef="plazo">
                <th mat-header-cell *matHeaderCellDef width="25%"> Plazo </th>
                <td mat-cell *matCellDef="let element"> {{element.plazo | date: 'dd-MM-yyyy'}} </td>
            </ng-container>
            <ng-container matColumnDef="Quitar">
                <th mat-header-cell *matHeaderCellDef width="10%"> Quitar </th>
                <td mat-cell *matCellDef="let element;index as i">
                    <button mat-icon-button class="primary-button" matTooltip="Quitar"
                        (click)="deleteTareaSinActividad(i)">
                        <mat-icon>cancel</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            <tr class="empty-row" *matNoDataRow>
                <td class="empty-cell">Sin registros por mostrar</td>
            </tr>
        </table>
    </div>
</form>
<br>
<mat-divider></mat-divider>
<mat-dialog-actions align="end">
    <button mat-button mat-dialog-close>Cancelar</button>
    <button mat-raised-button class="aproved-button" [disabled]="dataSource.length ==0"
        style="margin-left: 1rem;" (click)="registrarTareasSinActividad()">Asignar
    </button>
</mat-dialog-actions>
