<div class="alert">
    <div class="outline">
        <mat-icon>mail</mat-icon>
    </div>
    <h2>¿Estas seguro de notificar las metas?</h2><br>
    <h4 style="text-align:justify">"Al enviar la notificación se formalizarán los factores de evaluación del ciclo 2024, conforme lo señalado en el numeral 6.1.1  Etapa de Planificación de la Directiva  del Sub Sistema de GDR".</h4>
    <!-- <span>sgrhs.bienestar@essalud.gob.pe</span> -->
    <mat-form-field appearance="outline">
        <!-- <mat-label>Dirección de correo</mat-label> -->
        <input matInput [(ngModel)]="dto.email">
    </mat-form-field>
    <br>
</div>
<br>
<mat-grid-list cols="2" rowHeight="40px" gutterSize="6px">
    <mat-grid-tile [colspan]="1" class="grid">
        <button mat-button matDialogClose class="close-button">No</button>
    </mat-grid-tile>
    <mat-grid-tile [colspan]="1" class="grid">
        <button mat-raised-button (click)="enviarCorreo()" color="primary" class="boton">Si</button>
    </mat-grid-tile>
</mat-grid-list>
