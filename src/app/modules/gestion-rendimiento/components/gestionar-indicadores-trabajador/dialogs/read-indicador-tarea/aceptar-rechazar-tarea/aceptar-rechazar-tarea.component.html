<h3 *ngIf="reject == false">¿Estás seguro de aprobar el Indicador / Producto?</h3>
<h3 *ngIf="reject == true">¿Estás seguro de rechazar el Indicador / Producto?</h3>
<br>
<form *ngIf="reject == true" [formGroup]="form">
    <mat-form-field appearance="outline">
        <mat-label>Motivo</mat-label>
        <textarea matInput maxlength="300" required formControlName="frmMotivo"></textarea>
    </mat-form-field>
</form>
<mat-dialog-actions align="end">
    <button mat-button mat-dialog-close>No</button>
    <!--Poner este atributo cuando se haga el formulario
    [disabled]="form.valid == false"
    -->
    <button mat-raised-button class="aproved-button" *ngIf="reject == false" mat-dialog-close
        (click)="aprobarIndicador()">Si</button>
    <button mat-raised-button color="warn" *ngIf="reject == true" [disabled]="!form.valid" mat-dialog-close
        (click)="rechazarIndicador()">Rechazar</button>
</mat-dialog-actions>
