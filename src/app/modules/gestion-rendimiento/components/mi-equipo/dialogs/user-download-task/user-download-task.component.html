<h3 mat-dialog-title>Datos del requerimiento</h3>
<br>
<mat-dialog-content>
    <mat-grid-list cols="6" rowHeight="90px" gutterSize="6px" [formGroup]="form">
        <mat-grid-tile [colspan]="6">
            <mat-form-field appearance="outline">
                <mat-label>Titulo</mat-label>
                <input matInput formControlName="frmTitulo" readonly>
            </mat-form-field>
        </mat-grid-tile>
        <mat-grid-tile [colspan]="6">
            <mat-form-field appearance="outline">
                <mat-label>Descripcion</mat-label>
                <input matInput formControlName="frmDescripcion" readonly>
            </mat-form-field>
        </mat-grid-tile>
        <mat-grid-tile [colspan]="3">
            <mat-form-field appearance="outline">
                <mat-label>Fecha Registro</mat-label>
                <input matInput formControlName="frmFecFin" readonly>
            </mat-form-field>
        </mat-grid-tile>
        <mat-grid-tile [colspan]="3">
            <mat-form-field appearance="outline">
                <mat-label>Estado</mat-label>
                <input matInput formControlName="frmEstado" readonly>
            </mat-form-field>
        </mat-grid-tile>
    </mat-grid-list>
    <br>
    <div style="text-align: center">
        <h3>Tareas asignadas</h3>
    </div>
    <table mat-table [dataSource]="dataSource" style="width:100%">
        <ng-container matColumnDef="item">
            <th mat-header-cell *matHeaderCellDef width="100px">N°</th>
            <td mat-cell *matCellDef="let element, index as i">{{i+1}}</td>
        </ng-container>
        <ng-container matColumnDef="descripcion">
            <th mat-header-cell *matHeaderCellDef>Descripcion de la tarea</th>
            <td mat-cell *matCellDef="let element"> {{element.nombreTarea}} </td>
        </ng-container>
        <ng-container matColumnDef="fecha">
            <th mat-header-cell *matHeaderCellDef width="120px">Plazo máximo</th>
            <!-- <td mat-cell *matCellDef="let element"> {{element.fecha | date: 'dd-MM-yyyy HH:mm'}} </td> -->
            <td mat-cell *matCellDef="let element"> {{element.plazo}} </td>
        </ng-container>
        <ng-container matColumnDef="acciones">
            <th mat-header-cell *matHeaderCellDef width="100px">Evidencia</th>
            <td mat-cell *matCellDef="let element">
                <button mat-icon-button class="primary-button" matTooltip="Ver Evidencias" (click)="verFiles(element)">
                    <mat-icon>collections</mat-icon></button>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        <tr class="empty-row" *matNoDataRow>
            <td class="empty-cell">Sin registros por mostrar</td>
        </tr>
    </table>
    <!-- <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator> -->
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button mat-button mat-dialog-close>Cerrar</button>
    <button mat-raised-button color="primary" *ngIf="flgJefe && idEstado==2" (click)="confirmAprobar()">
        <mat-icon>check</mat-icon>Aprobar</button>
    <button mat-raised-button color="warn" *ngIf="flgJefe && idEstado==2" (click)="showDialogRejectTasks()">
        <mat-icon>close</mat-icon>Rechazar</button>
</mat-dialog-actions>
