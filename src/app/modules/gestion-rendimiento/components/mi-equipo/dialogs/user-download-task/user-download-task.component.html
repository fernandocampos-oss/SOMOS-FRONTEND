<h2 mat-dialog-title>Detalle de la Tarea</h2>
<mat-dialog-content>
    <mat-grid-list cols="6" rowHeight="90px" gutterSize="6px" [formGroup]="form">
        <mat-grid-tile [colspan]="6">
            <mat-form-field appearance="outline">
                <mat-label>Evidencia Solicitada</mat-label>
                <input matInput formControlName="frmDescripcion" readonly>
              </mat-form-field>
        </mat-grid-tile>
        <mat-grid-tile [colspan]="1">
            <mat-form-field appearance="outline">
                <mat-label>Código Tarea</mat-label>
                <input matInput formControlName="frmCodigo" readonly>
              </mat-form-field>
        </mat-grid-tile>
        <mat-grid-tile [colspan]="1">
            <mat-form-field appearance="outline">
                <mat-label>Plazo Máximo</mat-label>
                <input matInput formControlName="frmFecFin" readonly>
              </mat-form-field>
        </mat-grid-tile>
        <mat-grid-tile [colspan]="4">
            <mat-form-field appearance="outline">
                <mat-label>Estado</mat-label>
                <input matInput formControlName="frmEstado" readonly>
              </mat-form-field>
        </mat-grid-tile>
    </mat-grid-list>
    <table mat-table [dataSource]="dataSource" style="width:100%">
            
        <ng-container matColumnDef="item">
            <th mat-header-cell *matHeaderCellDef width="100px"> Item </th>
            <td mat-cell *matCellDef="let element"> {{element.item}} </td>
        </ng-container>
    
        <ng-container matColumnDef="descripcion">
            <th mat-header-cell *matHeaderCellDef> Descripción del informe</th>
            <td mat-cell *matCellDef="let element"> {{element.descripcion}} </td>
        </ng-container>

        <ng-container matColumnDef="porcentaje">
            <th mat-header-cell *matHeaderCellDef width="100px"> % de avance</th>
            <td mat-cell *matCellDef="let element"> {{element.avance}} %</td>
        </ng-container>

        <ng-container matColumnDef="fecha">
            <th mat-header-cell *matHeaderCellDef width="120px"> Fecha y Hora</th>
            <td mat-cell *matCellDef="let element"> {{element.fecha | date: 'dd-MM-yyyy HH:mm'}} </td>
        </ng-container>
    
        <ng-container matColumnDef="acciones">
            <th mat-header-cell *matHeaderCellDef width="100px"> Archivos </th>
            <td mat-cell *matCellDef="let element"> 
                <button mat-icon-button color="primary"
                matTooltip="Ver Evidencias" (click)="showDialogFiles(element)">
                <mat-icon>list</mat-icon></button>
            </td>
        </ng-container>
      
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        <tr class="empty-row" *matNoDataRow>
          <td class="empty-cell">Sin registros por mostrar</td>
        </tr>
      </table>
      <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cerrar</button>
  <button mat-raised-button color="primary" *ngIf="flgJefe && idEstado==2" (click)="confirmAprobar()">
    <mat-icon>check</mat-icon>Aprobar</button>
  <button mat-raised-button color="warn" *ngIf="flgJefe && idEstado==2" (click)="showDialogRejectTasks()">
    <mat-icon>close</mat-icon>Rechazar</button>
</mat-dialog-actions>
