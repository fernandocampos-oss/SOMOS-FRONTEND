<h2 mat-dialog-title>Requerimientos Asignados: {{nombreUsuario}}</h2>
<mat-dialog-content>
    <table mat-table [dataSource]="reqAsignados" style="width:100%">

        <ng-container matColumnDef="item">
            <th mat-header-cell *matHeaderCellDef width="100px"> Item </th>
            <td mat-cell *matCellDef="let element, index as i"> {{i+1}} </td>
        </ng-container>

        <ng-container matColumnDef="requerimiento">
            <th mat-header-cell *matHeaderCellDef> Requerimiento </th>
            <td mat-cell *matCellDef="let element"> {{element.requerimiento}} </td>
        </ng-container>

        <ng-container matColumnDef="estado">
            <th mat-header-cell *matHeaderCellDef width="100px"> Estado </th>
            <td mat-cell *matCellDef="let element"> {{element.estado}} </td>
        </ng-container>

        <ng-container matColumnDef="porcentaje">
            <th mat-header-cell *matHeaderCellDef width="100px"> % de avance </th>
            <td mat-cell *matCellDef="let element"> {{element.porcentaje}} %</td>
        </ng-container>

        <!-- <ng-container matColumnDef="fecFin">
            <th mat-header-cell *matHeaderCellDef width="100px"> Fecha de fin </th>
            <td mat-cell *matCellDef="let element"> {{element.fechaFin | date: 'dd/MM/yyyy'}} </td>
        </ng-container>

        <ng-container matColumnDef="estado">
            <th mat-header-cell *matHeaderCellDef width="100px"> Estado </th>
            <td mat-cell *matCellDef="let element"> {{element.estado}} </td>
        </ng-container> -->

        <!-- <ng-container matColumnDef="acciones">
            <th mat-header-cell *matHeaderCellDef width="100px"> Acciones </th>
            <td mat-cell *matCellDef="let element">
                <button mat-icon-button color="primary" matTooltip="Visualizar tarea"
                    (click)="showDialogDownloadTask(element)">
                    <mat-icon>search</mat-icon></button>
            </td>
        </ng-container> -->

        <ng-container matColumnDef="acciones">
            <th mat-header-cell *matHeaderCellDef width="120px"> Acciones </th>
            <td mat-cell *matCellDef="let element, index as i">
                <button mat-icon-button color="primary" (click)="showDialogDownloadTask(element, i)"
                    matTooltip="Visualizar tarea">
                    <mat-icon>remove_red_eye</mat-icon></button>
                <button mat-icon-button color="primary" (click)="finalizarTarea(element)" [disabled]="element.porcentaje!=100" matTooltip="Aprobar tarea">
                    <mat-icon>check</mat-icon></button>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        <tr class="empty-row" *matNoDataRow>
            <td class="empty-cell">Sin registros por mostrar</td>
        </tr>
    </table>
    <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button mat-button mat-dialog-close >Cerrar</button>
</mat-dialog-actions>
