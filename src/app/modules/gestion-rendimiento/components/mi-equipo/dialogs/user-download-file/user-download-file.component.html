<div style="text-align: center">
  <h3>Evidencias</h3>
</div>
<mat-dialog-content>
  <table mat-table [dataSource]="dataSource" style="width:100%">
    <ng-container matColumnDef="item">
      <th mat-header-cell *matHeaderCellDef width="100px">N°</th>
      <td mat-cell *matCellDef="let element, index as i">{{i+1}}</td>
    </ng-container>
    <ng-container matColumnDef="descripcion">
      <th mat-header-cell *matHeaderCellDef>Descripcion del Informe</th>
      <td mat-cell *matCellDef="let element">{{element.descripcion}}</td>
    </ng-container>
    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef width="120px">Acciones</th>
      <td mat-cell *matCellDef="let element">
        <button mat-icon-button class="primary-button" matTooltip="Descargar Imagen" (click)="downloadFile(element)">
          <mat-icon>cloud_download</mat-icon></button>
        <button mat-icon-button color="primary" *ngIf="element.ext == 'pdf'" matTooltip="Ver PDF"
          (click)="showDialogPdf(element)">
          <mat-icon>remove_red_eye</mat-icon></button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    <tr class="empty-row" *matNoDataRow>
      <td class="empty-cell">Sin registros por mostrar</td>
    </tr>
  </table>
  <!-- <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator> -->
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cerrar</button>
</mat-dialog-actions>
