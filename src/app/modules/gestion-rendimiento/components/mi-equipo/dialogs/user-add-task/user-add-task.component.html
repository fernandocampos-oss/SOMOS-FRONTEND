<form [formGroup]="form" (ngSubmit)="confirmSave()">
  <h2 matDialogTitle>Nueva Tarea</h2>
  <mat-dialog-content>
    <mat-grid-list cols="2" rowHeight="100px" gutterSize="6px">
      <mat-grid-tile [colspan]="1">
        <mat-form-field appearance="outline">
          <mat-label>Fecha Inicio</mat-label>
          <input matInput required formControlName="frmFecInicio" [matDatepicker]="picker1" readonly/>
          <mat-datepicker-toggle matSuffix [for]="picker1" [disabled]="auto==true?true:false"></mat-datepicker-toggle>
          <mat-datepicker #picker1></mat-datepicker>
        </mat-form-field>
      </mat-grid-tile>
      <mat-grid-tile [colspan]="1">
        <mat-form-field appearance="outline">
          <mat-label>Fecha Fin</mat-label>
          <input matInput required formControlName="frmFecFin" [matDatepicker]="picker2" readonly/>
          <mat-datepicker-toggle matSuffix [for]="picker2" [disabled]="auto==true?true:false"></mat-datepicker-toggle>
          <mat-datepicker #picker2></mat-datepicker>
        </mat-form-field>
      </mat-grid-tile>
      <mat-grid-tile [colspan]="2">
        <mat-form-field appearance="outline">
          <mat-label>Descripción</mat-label>
          <textarea matInput maxlength="300" required formControlName="frmDescripcion"></textarea>
        </mat-form-field>
      </mat-grid-tile>
    </mat-grid-list>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button mat-dialog-close>Cancelar</button>
    <button mat-raised-button color="primary" type="submit">Grabar</button>
  </mat-dialog-actions>
</form>
