<h4>Datos del trabajador</h4><br>
<div [formGroup]="formIntegrante" class="datos">
    <mat-grid-list [cols]="this.distribucionTotal" rowHeight="90px" gutterSize="6px" class="contenedorDatos">
        <mat-grid-tile>
            <mat-form-field appearance="outline">
                <mat-label>Nombre del miembro</mat-label>
                <input matInput formControlName="frmNombres">
            </mat-form-field>
        </mat-grid-tile>
        <mat-grid-tile>
            <mat-form-field appearance="outline">
                <mat-label>Apellido del miembro</mat-label>
                <input matInput formControlName="frmApellidos">
            </mat-form-field>
        </mat-grid-tile>
        <mat-grid-tile>
            <mat-form-field appearance="outline">
                <mat-label>Cargo</mat-label>
                <input matInput formControlName="frmCargo">
            </mat-form-field>
        </mat-grid-tile>
        <mat-grid-tile>
            <mat-form-field appearance="outline">
                <mat-label>Nro. Documento</mat-label>
                <input matInput formControlName="frmNroDoc">
            </mat-form-field>
        </mat-grid-tile>
        <mat-grid-tile>
            <mat-form-field appearance="outline">
                <mat-label>Código de planilla</mat-label>
                <input matInput formControlName="frmCodPlanilla">
            </mat-form-field>
        </mat-grid-tile>
        <mat-grid-tile>
            <mat-form-field appearance="outline">
                <mat-label>Fecha Nacimiento</mat-label>
                <input matInput formControlName="frmFecNac">
            </mat-form-field>
        </mat-grid-tile>
        <mat-grid-tile>
            <mat-form-field appearance="outline">
                <mat-label>Unidad Organizativa</mat-label>
                <input matInput formControlName="frmUnidad">
            </mat-form-field>
        </mat-grid-tile>
        <mat-grid-tile>
            <mat-form-field appearance="outline">
                <mat-label>Correo</mat-label>
                <input matInput formControlName="frmCorreo">
            </mat-form-field>
        </mat-grid-tile>
        <mat-grid-tile>
            <mat-form-field appearance="outline">
                <mat-label>Celular</mat-label>
                <input matInput formControlName="frmCelular">
            </mat-form-field>
        </mat-grid-tile>
    </mat-grid-list>
    <div class="mat-button-container" style="display: flex; justify-content: flex-end;">
        <button mat-raised-button color="primary" (click)='cerrar()'  style="margin-left: 1rem;background-color: var(--color-MiEssalud);">Cerrar</button>
    </div>
</div>
