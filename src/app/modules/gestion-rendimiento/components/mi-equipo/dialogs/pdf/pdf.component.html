<mat-dialog-content>
  <ngx-extended-pdf-viewer [base64Src]="pdfSrc" useBrowserLocale="true" height="400px" width="100%"></ngx-extended-pdf-viewer>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close class="close-button">Cerrar</button>
</mat-dialog-actions>
