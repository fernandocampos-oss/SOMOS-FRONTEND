<div class="alert">
    <h2>¿Estás seguro de eliminar el trabajador?</h2>
    <span>Una vez eliminado, no se podrá deshacer</span><br>
</div>
<br>
<mat-grid-list cols="2" rowHeight="40px" gutterSize="6px">
    <mat-grid-tile [colspan]="1" class="grid">
        <button mat-button matDialogClose class="close-button">No</button>
    </mat-grid-tile>
    <mat-grid-tile [colspan]="1" class="grid">
        <button mat-raised-button (click)="deleteTrabajador()" color="warn" class="boton">Si</button>
    </mat-grid-tile>
</mat-grid-list>
