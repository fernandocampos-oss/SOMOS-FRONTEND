    <button mat-raised-button class="eliminar-button" matTooltip="Eliminar colaborador" (click)="showDialogUser(true)">
        <mat-icon>remove_circle</mat-icon>&nbsp; Eliminar colaborador</button>
</div>

<table mat-table [dataSource]="dataSource" style="width:100%" matSort>
            
    <ng-container matColumnDef="item">
        <th mat-header-cell *matHeaderCellDef mat-sort-header width="100px"> Item </th>
        <td mat-cell *matCellDef="let element"> {{element.item}} </td>
    </ng-container>

    <ng-container matColumnDef="colaborador">
        <th mat-header-cell *matHeaderCellDef mat-sort-header width="300px"> Colaborador </th>
        <td mat-cell *matCellDef="let element"> {{element.colaborador}} </td>
    </ng-container>

    <ng-container matColumnDef="cargo">
        <th mat-header-cell *matHeaderCellDef mat-sort-header width="200px"> Cargo </th>
        <td mat-cell *matCellDef="let element"> {{element.cargo}} </td>
    </ng-container>

    <ng-container matColumnDef="tareas" >
        <th mat-header-cell *matHeaderCellDef mat-sort-header width="80px"> Tareas </th>
        <td mat-cell *matCellDef="let element"><div class="init">{{element.tareas}}</div></td>
    </ng-container>

    <ng-container matColumnDef="pendientes">
        <th mat-header-cell *matHeaderCellDef mat-sort-header width="80px"> Pendientes </th>
        <td mat-cell *matCellDef="let element" class="{{element.medida}}">
            <div class="center">{{element.pendientes}}</div>
        </td>
    </ng-container>

    <ng-container matColumnDef="pendientesAprobacion">
        <th mat-header-cell *matHeaderCellDef mat-sort-header width="80px"> Por Aprobar </th>
        <td mat-cell *matCellDef="let element" class="{{element.pendientesAprobacion > 0 ? 'aprobar':''}}">
            <div class="center">{{element.pendientesAprobacion}}</div>
        </td>
    </ng-container>

    <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef width="120px"> Acciones </th>
        <td mat-cell *matCellDef="let element"> 
            <button mat-icon-button color="primary" (click)="showDialogTaks(element)"
                matTooltip="Asignar Tarea" >
            <mat-icon>remove_red_eye</mat-icon></button>
            <button mat-icon-button color="primary" (click)="showDialogEdit(element)"
                matTooltip="Editar datos del colaborador" >
            <mat-icon>edit</mat-icon></button>
        </td>
    </ng-container>
  
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    <tr class="empty-row" *matNoDataRow>
      <td class="empty-cell">Sin registros por mostrar</td>
    </tr>
  </table>
  <mat-paginator [pageSizeOptions]="[10, 20, 30]" showFirstLastButtons></mat-paginator>
