<br>
<div class="btn-input">
  <mat-form-field appearance="outline">
    <mat-label>Ingrese nombre o apellido del integrante</mat-label>
    <input type="text" matInput [formControl]="integranteControl" [matAutocomplete]="autoPersona">
    <mat-autocomplete #autoPersona="matAutocomplete" [displayWith]="displayFnPersonal"
      (optionSelected)="onSelectionChangePersonal($event)">
      <mat-option *ngFor="let persona of filteredOptions | async" [value]="persona">
        {{persona.nombres}} {{(persona.apellidos)}}
      </mat-option>
    </mat-autocomplete>
  </mat-form-field>
  <button mat-raised-button color="primary" class="search" (click)="agregarColaborador()">Agregar</button>
</div>

<table mat-table [dataSource]="dataSource" style="width:100%" matSort>
  <ng-container matColumnDef="item">
    <th mat-header-cell *matHeaderCellDef mat-sort-header width="40px"> Item </th>
    <td mat-cell *matCellDef="let element, index as i">{{i+1}}</td>
  </ng-container>
  <ng-container matColumnDef="numero_documento">
    <th mat-header-cell *matHeaderCellDef mat-sort-header width="80px"> Numero Documento </th>
    <td mat-cell *matCellDef="let element"> {{element.numeroDocumento}} </td>
  </ng-container>
  <ng-container matColumnDef="nombre_persona">
    <th mat-header-cell *matHeaderCellDef mat-sort-header width="200px"> Nombres y Apellidos </th>
    <td mat-cell *matCellDef="let element"> {{element.nombres}} {{element.apellidos}}</td>
  </ng-container>
  <!-- <ng-container matColumnDef="pendientesAprobacion">
        <th mat-header-cell *matHeaderCellDef mat-sort-header width="80px"> Por Aprobar </th>
        <td mat-cell *matCellDef="let element" class="{{element.pendientesAprobacion > 0 ? 'aprobar':''}}">
            <div class="center">{{element.pendientesAprobacion}}</div>
        </td>
    </ng-container> -->

  <ng-container matColumnDef="acciones">
    <th mat-header-cell *matHeaderCellDef width="120px"> Acciones </th>
    <td mat-cell *matCellDef="let element">
      <button mat-raised-button class="btn-show" (click)="verRequerimientos(element)">Ver Requerimientos</button>
      &nbsp;
      <button mat-raised-button color="warn"
        (click)="eliminarColaborador(element)"><mat-icon>remove_circle</mat-icon>&nbsp; Eliminar</button>
      <!-- <button mat-icon-button class="has-warn" (click)="showDialogAdd(element)"
                matTooltip="Editar datos del colaborador" >
            <mat-icon>edit</mat-icon></button> -->
      <!-- <button mat-raised-button color="primary" (click)="downloadGDRPersona(i)">GDR</button> -->
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  <tr class="empty-row" *matNoDataRow>
    <td class="empty-cell">Sin registros por mostrar</td>
  </tr>
</table>
<mat-paginator [pageSizeOptions]="[10, 20, 30]" showFirstLastButtons></mat-paginator>
