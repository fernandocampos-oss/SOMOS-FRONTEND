<br><br>
<div style="text-align: center">
  <form [formGroup]="formFindSelect">
    <mat-form-field appearance="outline">
      <mat-label>Nombre del trabajador</mat-label>
      <input matInput formControlName="frmNombre" minlength="1" maxlength="13" />
    </mat-form-field>

    <button mat-raised-button color="primary" class="search" [disabled]="formFindSelect.value.frmNombre=== ''"
      style="margin-left: 1rem;" (click)="buscarVotante()">
      <mat-icon>search</mat-icon>&nbsp;
      <span>Buscar</span>
    </button>
  </form>
</div>
<div *ngIf="listVotantes.length !== 0">
  <table mat-table [dataSource]="dataSource" style="width:100%" matSort>
    <ng-container matColumnDef="item">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>N°</th>
      <td mat-cell *matCellDef="let element, index as i">{{i+1}}</td>
    </ng-container>
    <ng-container matColumnDef="numero_documento">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>DNI</th>
      <td mat-cell *matCellDef="let element">{{element.numeroDocumento}}</td>
    </ng-container>
    <ng-container matColumnDef="nombre">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombres</th>
      <td mat-cell *matCellDef="let element">{{element.nombres | titlecase}}</td>
    </ng-container>
    <ng-container matColumnDef="apellido">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Apellidos</th>
      <td mat-cell *matCellDef="let element">{{element.apellidos | titlecase}}</td>
    </ng-container>
    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let element">
        <button mat-raised-button color="primary" [disabled]="formFindSelect.value.frmNombre=== ''"
          style="margin-left: 1rem;" (click)="verDatosGDR(element)">
          Ver Datos GDR
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    <tr class="empty-row" *matNoDataRow>
      <td class="empty-cell">Sin registros por mostrar</td>
    </tr>
  </table>
</div>
