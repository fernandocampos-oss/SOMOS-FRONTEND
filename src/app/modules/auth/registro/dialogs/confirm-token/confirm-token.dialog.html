<form class="dialog" [formGroup]="form" (ngSubmit)="onActivate()">
  <h1 mat-dialog-title class="dialog__title">Activa tu cuenta</h1>
  <div mat-dialog-content>
    <p>Ingresa el código enviado a <strong>{{data.correo}}</strong></p>
    <mat-form-field class="w-100 mt-2" appearance="fill">
      <mat-label>Código de Activación</mat-label>
      <input matInput cdkFocusInitial formControlName="token" />
    </mat-form-field>
  </div>
  <div class="dialog__footer" mat-dialog-actions>
    <button mat-button mat-dialog-close type="button">Cancelar</button>
    <button mat-raised-button color="primary">Activar</button>
  </div>
</form>
