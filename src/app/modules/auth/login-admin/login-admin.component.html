<div class="auth card mat-elevation-z8" style="margin-top: 10px;">
    <div class="auth__header">
     
        <img src="assets/images/Logo-MiEsSalud-ColorVertical.png" class="image" alt="Logotipo"
        />
     
     
    </div>
  
  
    <div class="auth__body">
      <form
        autocomplete="off"
        class="form"
        [formGroup]="form"
        (ngSubmit)="login()"
      >
        <mat-form-field appearance="outline">
          <mat-label>Usuario</mat-label>
          <input matInput formControlName="username" />
          <mat-icon matPrefix>person &nbsp;</mat-icon>
          <mat-error *ngIf="usuarioField.hasError('required')"
            >El usuario es obligatorio</mat-error
          >
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Contraseña</mat-label>
          <input
            matInput
            [type]="hidePassword ? 'password' : 'text'"
            formControlName="password"
          />
          <mat-icon matPrefix>lock &nbsp;</mat-icon>
          <button
            type="button"
            mat-icon-button
            matSuffix
            (click)="hidePassword = !hidePassword"
            matTooltip="Mostrar contraseña"
          >
            <mat-icon>{{
              hidePassword ? 'visibility_off' : 'visibility'
            }}</mat-icon>
          </button>
          <mat-error *ngIf="passwordField.hasError('required')"
            >La contraseña es obligatoria</mat-error
          >
        </mat-form-field>
  
        <div class="auth__actions">
          <button mat-raised-button  class="btnColor" type="submit">Ingresar</button>
        </div>  
      </form>
    </div>
  </div>
