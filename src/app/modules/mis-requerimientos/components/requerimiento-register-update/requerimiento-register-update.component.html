<h2 matDialogTitle>{{this.data.esEditar == true ? 'Editar Requerimiento':'Nuevo Requerimiento'}}</h2>
<form [formGroup]="form">
    <mat-dialog-content>
        <mat-grid-list cols="6" rowHeight="110px" gutterSize="6px">
            <mat-grid-tile [colspan]="6">
                <mat-form-field appearance="outline">
                    <mat-label>Titulo</mat-label>
                    <input matInput required formControlName="frmNombre" maxlength="250" />
                </mat-form-field>
            </mat-grid-tile>
            <mat-grid-tile [colspan]="6">
                <mat-form-field appearance="outline">
                    <mat-label>Descripción</mat-label>
                    <textarea matInput formControlName="frmDescripcion" maxlength="350"></textarea>
                </mat-form-field>
            </mat-grid-tile>
            <mat-grid-tile [colspan]="3">
                <mat-form-field appearance="outline">
                    <mat-label>Medio de ingreso</mat-label>
                    <mat-select [(value)]="idTipoIngresoSeleccionado" formControlName="frmMedio">
                        <mat-option *ngFor="let t of listTipoIngreso" [value]="t.idTipoIngreso">
                            {{t.descripcion}}
                        </mat-option>
                    </mat-select>
                </mat-form-field>
            </mat-grid-tile>
            <mat-grid-tile [colspan]="3">
                <mat-form-field appearance="outline">
                    <mat-label>Identificador del requerimiento</mat-label>
                    <input matInput required formControlName="frmIdentificador" maxlength="20" />
                </mat-form-field>
            </mat-grid-tile>
        </mat-grid-list>
    </mat-dialog-content>
</form>
<mat-dialog-actions align="end">
    <button mat-button mat-dialog-close type="button">Cancelar</button>
    <button mat-raised-button class="btnsave" type="submit" (click)="registrarActualizarRequerimiento()"
        [disabled]="form.valid == false">{{this.data.esEditar == true ? 'Actualizar':'Registrar'}}</button>
</mat-dialog-actions>
