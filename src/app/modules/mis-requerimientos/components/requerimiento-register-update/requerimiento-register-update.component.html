<h2 matDialogTitle>{{this.data.esEditar == true ? 'Editar Indicador / Producto':'Registrar Indicador / Producto'}}</h2>
<form [formGroup]="form">
    <mat-dialog-content>
        <mat-grid-list cols="6" rowHeight="110px" gutterSize="6px">
            <mat-grid-tile [colspan]="6">
                <mat-form-field appearance="outline">
                    <mat-label>Título</mat-label>
                    <input matInput required formControlName="frmNombre" maxlength="250" />
                </mat-form-field>
            </mat-grid-tile>
            <mat-grid-tile [colspan]="6">
                <mat-form-field appearance="outline">
                    <mat-label>Descripción</mat-label>
                    <textarea matInput formControlName="frmDescripcion" maxlength="350"></textarea>
                </mat-form-field>
            </mat-grid-tile>
            <mat-grid-tile [colspan]="3">
                <mat-form-field appearance="outline">
                    <mat-label>Tipo de ingreso</mat-label>
                    <mat-select [(value)]="idTipoIngresoSeleccionado" formControlName="frmTipoIngreso">
                        <mat-option *ngFor="let t of listTipoIngreso" [value]="t.idTipoIngreso">
                            {{t.descripcion | titlecase}}
                        </mat-option>
                    </mat-select>
                </mat-form-field>
            </mat-grid-tile>
            <mat-grid-tile [colspan]="3">
                <mat-form-field appearance="outline">
                    <mat-label>Tipo de valor meta</mat-label>
                    <mat-select [(value)]="idValorMetaSeleccionado" formControlName="frmTipoValorMeta"
                        (selectionChange)="onSelectionChangeTipoValorMeta($event)">
                        <mat-option *ngFor="let t of listTipoValorMeta" [value]="t.idTipoValorMeta">
                            {{t.descripcion | titlecase}}
                        </mat-option>
                    </mat-select>
                </mat-form-field>
            </mat-grid-tile>
            <div *ngIf="onChangeValueTipoValorMeta ==1 || onChangeValueTipoValorMeta ==2">
                <mat-grid-tile [colspan]="3">
                    <mat-form-field appearance="outline">
                        <mat-label>Ingrese valor numérico</mat-label>
                        <input matInput formControlName="frmValorMeta" maxlength="3" required />
                    </mat-form-field>
                </mat-grid-tile>
            </div>
            <div *ngIf="onChangeValueTipoValorMeta ==4">
                <mat-grid-tile [colspan]="3">
                    <mat-form-field appearance="outline">
                        <mat-label>Ingrese valor porcentual</mat-label>
                        <input matInput formControlName="frmValorMeta" minlength="1" maxlength="3"
                            class="example-right-align" required />
                        <span matSuffix class="percent-align">%</span>
                    </mat-form-field>
                </mat-grid-tile>
            </div>
        </mat-grid-list>
    </mat-dialog-content>
</form>
<mat-dialog-actions align="end">
    <button mat-button mat-dialog-close type="button">Cancelar</button>
    <button mat-raised-button class="btnsave" type="submit" (click)="registrarActualizarIndicador()"
        [disabled]="form.valid == false">{{this.data.esEditar == true ? 'Actualizar':'Registrar'}}</button>
</mat-dialog-actions>
