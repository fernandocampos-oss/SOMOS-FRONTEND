<div *ngIf="stringBase64 != null">
  <h4>Descripción de la evidencia:</h4>
  <h4>{{descripcionEvidencia}}</h4>
  <img class="imgInfo boxBorde" src='data:image/jpeg;base64,{{stringBase64}}' alt='{{descripcionEvidencia}}'>
</div>

<div *ngIf="stringBase64 == null">
  <h4>Aún no tiene evidencias</h4>
</div>

<mat-dialog-actions align="end">
  <button mat-button *ngIf="stringBase64 != null" class="download-button" (click)="downloadFile()">
    <mat-icon>file_download</mat-icon>
    Descargar
  </button>
  <button mat-button mat-dialog-close class="close-button">Cerrar</button>
</mat-dialog-actions>
