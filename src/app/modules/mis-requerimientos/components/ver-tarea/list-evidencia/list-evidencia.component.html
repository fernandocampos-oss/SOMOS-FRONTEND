<div style="text-align: center">
  <h3>Mis evidencias</h3>
</div><br>
<h3>Tarea: {{ titleTarea }}</h3>
<table mat-table [dataSource]="dataSource" style="width:100%">
  <ng-container matColumnDef="item">
    <th mat-header-cell *matHeaderCellDef>N°</th>
    <td mat-cell *matCellDef="let element, index as i">{{i+1}}</td>
  </ng-container>
  <ng-container matColumnDef="descripcion">
    <th mat-header-cell *matHeaderCellDef>Descripcion del Informe</th>
    <td mat-cell *matCellDef="let element"> {{element.descripcion}} </td>
  </ng-container>
  <!-- <ng-container matColumnDef="porcentaje_avance">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Avance (%)</th>
    <td mat-cell *matCellDef="let element">
      {{element.porcentajeAvance}}
    </td>
  </ng-container> -->
  <ng-container matColumnDef="fecha_creacion">
    <th mat-header-cell *matHeaderCellDef>Fecha</th>
    <td mat-cell *matCellDef="let element"> {{element.fechaCreacion | date: 'dd/MM/y'}} </td>
  </ng-container>
  <ng-container matColumnDef="plazo">
    <th mat-header-cell *matHeaderCellDef>Plazo Máximo</th>
    <td mat-cell *matCellDef="let element"> {{element.plazo}} </td>
  </ng-container>
  <!-- <ng-container matColumnDef="estado">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Estado</th>
    <td mat-cell *matCellDef="let element">
      {{element.estado}}
    </td>
  </ng-container> -->
  <ng-container matColumnDef="acciones">
    <th mat-header-cell *matHeaderCellDef>Acciones</th>
    <td mat-cell *matCellDef="let element">
      <button mat-icon-button class="icon-button" matTooltip="Descargar Imagen" (click)="downloadFile(element)">
        <mat-icon>cloud_download</mat-icon></button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  <tr class="empty-row" *matNoDataRow>
    <td class="empty-cell">Sin registros por mostrar</td>
  </tr>
</table>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close class="close-button">Cerrar</button>
</mat-dialog-actions>
