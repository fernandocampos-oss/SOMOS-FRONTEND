<!--<h3>Tarea: {{ titleTarea }}</h3> -->
<form [formGroup]="form">
  <h2 mat-dialog-title>Registrar Evidencia</h2>
  <mat-dialog-content>
    <mat-tab-group [(selectedIndex)]="selectedIndex" (selectedTabChange)="onTabChanged($event)">
      <mat-tab label="Detalle">
        <br>
        <mat-grid-list cols="2" rowHeight="110px" gutterSize="6px">
          <mat-grid-tile [colspan]="2">
            <mat-form-field appearance="outline">
              <mat-label>Descripción</mat-label>
              <textarea matInput formControlName="frmDescripcion" type="text" minlength="5" maxlength="300"
                required></textarea>
            </mat-form-field>
          </mat-grid-tile>

          <mat-grid-tile [colspan]="1">
            <mat-form-field appearance="outline">
              <mat-label>Porcentaje de avance</mat-label>
              <mat-hint>Valor: 10-100</mat-hint>
              <input matInput type="number" required formControlName="frmPorcentajeAvance" minlength="2"
                maxlength="3" />
            </mat-form-field>
          </mat-grid-tile>

        </mat-grid-list>
      </mat-tab>

      <mat-tab label="Archivo">
        <br>
        <div class="cargaImg">
          <div class="imageBox">
            <div style="text-align: center">
              <!-- <h4>Máx. 2MB</h4> -->
              <button type="button" class="preview__button btnColor" mat-raised-button MatPrefix (click)="file.click()"
                *ngIf="!retrievedImage">
                <mat-icon>add_photo_alternate</mat-icon> Cargar Imagen
              </button>
              <button type="button" class="preview__button" mat-raised-button MatPrefix (click)="removeImage()"
                color="warn" *ngIf="retrievedImage">
                <mat-icon>clear</mat-icon> Remover Imagen
              </button>
            </div>
            <input hidden #file type="file" accept="Image/*" (change)="onChangeImage(file.files)" />
            <img class="preview__img" [src]="retrievedImage" *ngIf="retrievedImage" />
          </div>
        </div>
      </mat-tab>

    </mat-tab-group>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button mat-dialog-close type="button">Cancelar</button>
    <button mat-raised-button class="btnsave" *ngIf="selectedIndex == 0" [disabled]="form.valid == false"
      (click)="next()">Siguiente</button>
    <button mat-raised-button class="btnsave" type="submit" (click)="registrarEvidencia()" *ngIf="selectedIndex == 1"
      [disabled]="this.sizeImage === 0">Enviar Informe</button>
  </mat-dialog-actions>
</form>
