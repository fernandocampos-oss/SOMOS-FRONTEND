<form [formGroup]="form">
  <h2 mat-dialog-title>Registrar Evidencia</h2>
  <mat-dialog-content>
    <mat-tab-group [(selectedIndex)]="selectedIndex" (selectedTabChange)="onTabChanged($event)">
      <mat-tab label="Detalle">
        <br>
        <mat-grid-list cols="2" rowHeight="110px" gutterSize="6px">
          <mat-grid-tile [colspan]="2">
            <mat-form-field appearance="outline">
              <mat-label>Descripción</mat-label>
              <textarea matInput formControlName="frmDescripcion" type="text" minlength="5" maxlength="300"
                required></textarea>
            </mat-form-field>
          </mat-grid-tile>

          <mat-grid-tile [colspan]="1">
            <mat-form-field appearance="outline">
              <mat-label>Porcentaje de avance</mat-label>
              <!-- <mat-hint>Ingrese el valor numérico</mat-hint> -->
              <input matInput type="number" required formControlName="frmPorcentajeAvance" minlength="2" maxlength="3"
                class="example-right-align" />
              <span matSuffix class="percent-align">%</span>
            </mat-form-field>
          </mat-grid-tile>
        </mat-grid-list>
      </mat-tab>

      <mat-tab label="Archivo">
        <br>
        <div class="datosPdf">
          <mat-radio-group name="opciones" [(ngModel)]="operacionSeleccionada" [ngModelOptions]="{standalone: true}">
            <mat-radio-button *ngFor="let ta of tipoArchivo" name="opciones" [value]="ta" style="margin: 10px">
              {{ta}}
            </mat-radio-button>
          </mat-radio-group>
        </div>
        <br>

        <div *ngIf="operacionSeleccionada=='Imagen'">
          <div class="cargaImg">
            <div class="imageBox">
              <div style="text-align: center">
                <!-- <h4>Máx. 2MB</h4> -->
                <button type="button" class="preview__button btnColor" mat-raised-button MatPrefix
                  (click)="file.click()" *ngIf="!retrievedImage">
                  <mat-icon>add_photo_alternate</mat-icon> Cargar Imagen
                </button>
                <button type="button" class="preview__button" mat-raised-button MatPrefix (click)="removeImage()"
                  color="warn" *ngIf="retrievedImage">
                  <mat-icon>clear</mat-icon> Remover Imagen
                </button>
              </div>
              <input hidden #file type="file" accept="Image/*" (change)="onChangeImage(file.files)" />
              <img class="preview__img" [src]="retrievedImage" *ngIf="retrievedImage" />
              <img class="preview__img" src="assets/images/imgPlaceholder.png" *ngIf="!retrievedImage" />
            </div>
          </div>
        </div>

        <!-- pdf -->
        <div class="cargaImg" *ngIf="operacionSeleccionada=='PDF'">
          <div class="pdfContainer">
            <div class="datosPdf">
              <button type="button" class="preview__button btnOptionsActive" mat-raised-button MatPrefix
                (click)="filePdf.click()" color="primary" *ngIf="!retrievedPdf" [disabled]='estadoInscripcion'>
                <mat-icon>attach_file</mat-icon> Cargar PDF
              </button>
              <button type="button" class="preview__button" mat-raised-button MatPrefix (click)="removePdf()"
                color="warn" *ngIf="retrievedPdf" [disabled]='estadoInscripcion'>
                <mat-icon>clear</mat-icon> Remover PDF
              </button>
            </div>
            <div class="datosPdf">
              <h5 *ngIf="retrievedPdf">{{nombrePdf}}</h5>
              <img class="preview__img" src="assets/images/pdfSelected.png" *ngIf="retrievedPdf" (click)='downloadPdf()'
                matTooltip="Descargar PDF" matTooltipPosition="right" style='cursor: pointer;' />
              <img class="preview__img" src="assets/images/pdfPlaceholder.png" *ngIf="!retrievedPdf" />
            </div>
            <input hidden #filePdf type="file" name="Upload" accept="application/pdf"
              (change)="onChangeFile(filePdf.files)">
          </div>
        </div>

      </mat-tab>

    </mat-tab-group>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button mat-dialog-close type="button">Cancelar</button>
    <button mat-raised-button class="btnsave" *ngIf="selectedIndex == 0" [disabled]="form.valid == false"
      (click)="next()">Siguiente</button>
    <button mat-raised-button class="btnsave" type="submit" (click)="registrarEvidencia()" *ngIf="selectedIndex == 1"
      [disabled]="this.sizeImage === 0">Enviar Informe</button>
  </mat-dialog-actions>
</form>
