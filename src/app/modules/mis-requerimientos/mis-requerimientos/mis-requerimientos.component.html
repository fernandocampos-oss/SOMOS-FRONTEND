<div class="page">
    <div class="matero-page-header">
      <h1 class="matero-page-title"><mat-icon>description</mat-icon> Mis Requerimientos<br>
      <small class="mr-2">Aquí podrá solicitar o ver el estado de sus requerimientos solicitados</small><br>
      </h1>
    </div>
    <div class="page__body">
        <div class="card shadow">
          <app-crud
          [data]="requerimientoList"
          [columns]="requerimientoColumns"
          [showEdit]="true"
          [showDelete]="true"
          [showFilter]="true"
          
          (create)="onCreateRequerimiento()"
          (delete)="onDeleteRequerimiento($event)"
        ></app-crud>
        </div>
    </div>
  </div>
