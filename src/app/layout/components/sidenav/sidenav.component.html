<div class="sidenav">
  <div class="sidenav__header">
    <img src="assets/images/Logo-MiEsSalud-ColorHorizontal.png" alt="Essalud" class="sidenav__img2" />
    <div class="sidenav__block"></div>
  </div>
  <div class="sidenav__body">
    <div class="header-avatar">
    <p class="ltitle">Bienvenido</p>
    <img src="assets/images/avatar.png" alt="Essalud" class="sidenav__img" />
      <b>{{ nombre | titlecase }}</b><br>
      <h5 class="brand__description">{{ email }}</h5>
      <mat-icon #tooltip="matTooltip" matTooltip="Cambiar contraseña" class="cursor" (click)="cambiar_contra()">lock</mat-icon>
      <!-- <h4>Gerencia: {{ gerencia }}</h4> -->
    </div>  
    <mat-nav-list>
      <ng-container>
        <mat-list-item
          *ngFor="let item of menuItemList"
          routerLinkActive="active"
          [routerLink]="['/' + item.path]"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          <mat-icon *ngIf ="!item.svg" mat-list-icon>{{ item.icon }}</mat-icon>
          <mat-icon *ngIf ="item.svg" mat-list-icon svgIcon={{item.icon}} class="icon"></mat-icon>
          <span class="option" matLine>{{ item.label }} </span>
        </mat-list-item>
      </ng-container>
    </mat-nav-list>
  </div>
</div>
