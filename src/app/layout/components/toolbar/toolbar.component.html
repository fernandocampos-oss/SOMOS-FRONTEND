<mat-toolbar class="toolbar mat-elevation-z3">
  <button mat-icon-button (click)="menuToggle.emit()">
    <mat-icon>menu</mat-icon>
    <!-- <mat-icon mat-list-icon class="chevron-button">chevron_right</mat-icon> -->
  </button>
  <a [routerLink]="['/']"
    ><img src="assets/images/Logo-MiEsSalud-ColorHorizontal-white.png" class="toolbar__image" alt="Logotipo" /></a>
   
  <span class="toolbar__spacer"></span>
  <p class="fecha" *ngIf="!hideDate">{{ fechaActual }}</p>
  <button mat-button [matMenuTriggerFor]="menu">
    <app-user-avatar [username]="user.nombres"></app-user-avatar>
  </button>

  <mat-menu #menu="matMenu">
    <div style="padding: 0 3% 0 3%; display: flex;">
      <app-user-avatar [username]="user.nombres"></app-user-avatar>
      <div style="display: block; padding-left:3%;">
    <span class="info" style="font-size: 14px;">{{nombre}}</span><br>
    <span class="info" style="font-size: 12px;">{{correo}}</span>
    </div></div>
    <button mat-menu-item (click)="logout()">
      <mat-icon>reply</mat-icon>
      <span>Cerrar Sesión</span>
    </button>
  </mat-menu>
</mat-toolbar>
