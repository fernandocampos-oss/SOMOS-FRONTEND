<h1 mat-dialog-title class="confirm-dialog__title">Confirmacion</h1>
<div mat-dialog-content>
  <p class="confirm-dialog__message">{{confirmMessage}}</p>
</div>
<div mat-dialog-actions class="confirm-dialog__footer">
  <button type="submit" class="confirm-dialog__button" mat-raised-button [mat-dialog-close]="true" color="warn">
    Aceptar
  </button>
  <button type="button" class="confirm-dialog__button" mat-button mat-dialog-close>
    Cancelar
  </button>
</div>
